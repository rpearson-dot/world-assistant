name: world-assistant

# Redis is part of this stack (password protected). Home Assistant is optional: set WA_MQTT_HOST to the
# broker it uses (your own, or the bundled one in docker-compose.mqtt.yml), or leave it empty.
# scripts/setup.sh asks the questions and writes .env and the secrets for you.
#
#   docker compose up -d --build
#       API at http://<server-ip>:${WA_API_PORT:-8010}. Touches nothing else.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#       Same, plus Traefik routing. Needs Traefik on a user-defined network.

x-app: &app
  build:
    context: .
    args:
      VERSION: ${WA_VERSION:-dev}
      COMMIT: ${WA_COMMIT:-local}
  # A released image reference (by digest) in WA_IMAGE skips the local build; see docs/runbook.md
  image: ${WA_IMAGE:-world-assistant:local}
  restart: unless-stopped
  networks: [internal]
  volumes:
    # Backups (status page, scripts/deploy.sh). Keep copies somewhere other than this server too.
    - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/backups:/backups
    # Keys saved from the Settings page (only the data sources' keys; see app/keys.py)
    - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/keys:/keys
  environment:
    WA_BACKUP_KEEP: ${WA_BACKUP_KEEP:-14}
    TZ: ${TZ:-Europe/London}
    WA_ENV: ${WA_ENV:-production}
    WA_LOG_LEVEL: ${WA_LOG_LEVEL:-INFO}
    WA_DB_HOST: wa-db
    # Default: the password-protected Redis in this stack. Leave WA_REDIS_URL unset in .env to use it.
    WA_REDIS_URL: ${WA_REDIS_URL:-redis://wa-redis:6379/0}
    # Empty: nothing is published to Home Assistant. A broker on another host: its LAN IP (container names
    # do not resolve across Docker networks). The bundled broker: wa-mqtt.
    WA_MQTT_HOST: ${WA_MQTT_HOST:-}
    WA_MQTT_PORT: ${WA_MQTT_PORT:-1883}
    WA_MQTT_USER: ${WA_MQTT_USER:-}
    WA_MQTT_PUBLISH_PORT: ${WA_MQTT_PUBLISH_PORT:-1883}
    WA_MQTT_TLS: ${WA_MQTT_TLS:-false}
    WA_MQTT_TLS_CA: ${WA_MQTT_TLS_CA:-}
    # The web pages and API need no token from the local network (docs/security.md). false: always ask.
    WA_LOCAL_NO_TOKEN: ${WA_LOCAL_NO_TOKEN:-true}
    WA_LOCAL_HOSTS: ${WA_LOCAL_HOSTS:-}
    # Over Tailscale (docker-compose.tailscale.yml), pages in a browser need no token; false: they ask too.
    WA_TAILNET_WEB_NO_TOKEN: ${WA_TAILNET_WEB_NO_TOKEN:-true}
    # The front door (wa-proxy below): who connected is taken from it, and the stack calls the api through it
    WA_FRONT_PROXY: wa-proxy
    WA_HA_API_URL: ${WA_HA_API_URL:-http://wa-proxy:8000}
    WA_NH_RATE_LIMIT_PER_MINUTE: ${WA_NH_RATE_LIMIT_PER_MINUTE:-8}
    WA_NH_CAPTURE_ENABLED: ${WA_NH_CAPTURE_ENABLED:-true}
    WA_NH_POLL_ENABLED: ${WA_NH_POLL_ENABLED:-true}
    WA_FUEL_POLL_ENABLED: ${WA_FUEL_POLL_ENABLED:-true}
    WA_CODEPOINT_POLL_ENABLED: ${WA_CODEPOINT_POLL_ENABLED:-true}
    WA_BOUNDARY_POLL_ENABLED: ${WA_BOUNDARY_POLL_ENABLED:-true}
    WA_BOUNDARY_KINDS: ${WA_BOUNDARY_KINDS:-region,county,district}
    WA_USRN_POLL_ENABLED: ${WA_USRN_POLL_ENABLED:-false}
    # TfWM's HTTPS address presents another company's certificate; http://api.tfwm.org.uk works (key unencrypted)
    WA_TFWM_BASE_URL: ${WA_TFWM_BASE_URL:-}
    # Modules from outside the image (docs/modules.md)
    WA_EXTRA_MODULES: ${WA_EXTRA_MODULES:-}
    WA_FLOOD_POLL_ENABLED: ${WA_FLOOD_POLL_ENABLED:-true}
    WA_HA_PUBLISH: ${WA_HA_PUBLISH:-true}
    WA_HA_INTERVAL_MIN: ${WA_HA_INTERVAL_MIN:-5}
    WA_TFLROADS_POLL_ENABLED: ${WA_TFLROADS_POLL_ENABLED:-true}
    WA_TFL_STATIONS_POLL_ENABLED: ${WA_TFL_STATIONS_POLL_ENABLED:-true}
    WA_UKPN_POLL_ENABLED: ${WA_UKPN_POLL_ENABLED:-true}
    WA_UKPN_FAULT_INTERVAL_MIN: ${WA_UKPN_FAULT_INTERVAL_MIN:-60}
    WA_UKPN_FAULT_ALERT_INTERVAL_MIN: ${WA_UKPN_FAULT_ALERT_INTERVAL_MIN:-15}
    WA_GRIDSERVE_POLL_ENABLED: ${WA_GRIDSERVE_POLL_ENABLED:-true}
    WA_GRIDSERVE_INTERVAL_MIN: ${WA_GRIDSERVE_INTERVAL_MIN:-60}
    WA_BUS_DISRUPTIONS_POLL_ENABLED: ${WA_BUS_DISRUPTIONS_POLL_ENABLED:-false}
    WA_BUS_DISRUPTIONS_KM: ${WA_BUS_DISRUPTIONS_KM:-25}
    WA_ENERGY_POLL_ENABLED: ${WA_ENERGY_POLL_ENABLED:-true}
    WA_OCTOPUS_ACCOUNT: ${WA_OCTOPUS_ACCOUNT:-}
    WA_OCTOPUS_TARIFF: ${WA_OCTOPUS_TARIFF:-}
    WA_NAPTAN_POLL_ENABLED: ${WA_NAPTAN_POLL_ENABLED:-true}
    WA_FUEL_PRICE_INTERVAL_MIN: ${WA_FUEL_PRICE_INTERVAL_MIN:-30}
    WA_NH_LIVE_INTERVAL_MIN: ${WA_NH_LIVE_INTERVAL_MIN:-10}
    WA_NH_PLANNED_INTERVAL_HOURS: ${WA_NH_PLANNED_INTERVAL_HOURS:-2}
    WA_NH_PLANNED_DAYS: ${WA_NH_PLANNED_DAYS:-14}
    WA_NH_PLANNED_MAX_PAGES: ${WA_NH_PLANNED_MAX_PAGES:-40}
    WA_NH_CAPTURE_RETENTION_DAYS: ${WA_NH_CAPTURE_RETENTION_DAYS:-3}
    WA_NH_VMS_BBOX: ${WA_NH_VMS_BBOX:-51.20,-2.05,52.60,-0.30}
    # Optional key vault (see docs/secrets.md). Default: files only.
    WA_SECRETS_BACKEND: ${WA_SECRETS_BACKEND:-files}
    WA_SECRETS_CACHE_SECONDS: ${WA_SECRETS_CACHE_SECONDS:-300}
    WA_SECRETS_COMMAND: ${WA_SECRETS_COMMAND:-}
    WA_VAULT_ADDR: ${WA_VAULT_ADDR:-}
    WA_VAULT_MOUNT: ${WA_VAULT_MOUNT:-secret}
    WA_VAULT_PATH: ${WA_VAULT_PATH:-world-assistant}
    WA_VAULT_NAMESPACE: ${WA_VAULT_NAMESPACE:-}
    WA_VAULT_CA_FILE: ${WA_VAULT_CA_FILE:-}
  secrets:
    - postgres_password
    - nh_subscription_key
    - nh_subscription_key_secondary
    - mqtt_password
    - api_token
    - fuel_finder_client_id
    - fuel_finder_client_secret
    - tfl_app_key
    - nr_access_token
    - skiddle_api_key
    - bods_api_key
    - tfwm_app_id
    - tfwm_app_key
    - ukpn_api_key
    - gridserve_api_key
    - octopus_api_key
    - ticketmaster_api_key
    - datathistle_token
    - datathistle_refresh_token
    - what3words_api_key
    - pollen_api_key
    - dvla_api_key
    - dvsa_mot_api_key
    - dvsa_mot_client_id
    - dvsa_mot_client_secret
    - dvsa_mot_scope_url
    - dvsa_mot_token_url
    - kitchenowl_token
    - sainsburys_email
    - sainsburys_password
    - ocado_email
    - ocado_password
    - redis_password

services:
  wa-db:
    # PostgreSQL 16 (PostGIS 3.4) until scripts/pg-upgrade.sh moves the data to 18 (PostGIS 3.6) and sets these
    # three in .env; new installs start on 18 (scripts/setup.sh). Never change the version here by hand: a new major
    # version cannot open the old one's data folder. 18 keeps its data one level deeper (/var/lib/postgresql/18/docker).
    image: postgis/postgis:${WA_PG_TAG:-16-3.4}
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/database.png"
    environment:
      POSTGRES_DB: worldassistant
      POSTGRES_USER: worldassistant
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ:-Europe/London}
    secrets:
      - postgres_password
    volumes:
      # Keep this on the cache pool (an SSD), not the parity-protected array.
      - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/${WA_PG_DIR:-pgdata}:${WA_PG_MOUNT:-/var/lib/postgresql/data}
    networks: [internal]
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. On first start Postgres runs a
      # temporary server that listens only on its internal socket; without -h
      # the check passes during that phase and dependants connect too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U worldassistant -d worldassistant"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Private to the stack (no published port) and password protected. It only holds rate-limit counters,
  # short-lived caches and the worker heartbeat, so nothing is saved to disk.
  wa-redis:
    image: redis:8-alpine
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/cache.png"
    environment:
      TZ: ${TZ:-Europe/London}
    secrets:
      - redis_password
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis_password)"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      wa-db:
        condition: service_healthy

  # The front door: the only published port. Every request goes through it to the api, so an update can start the
  # new version beside the old one and move requests across without a gap (scripts/rollout.sh). It holds nothing:
  # which api answers is in WA_DATA_DIR/proxy/upstreams.caddy, rewritten by the rollout.
  wa-proxy:
    image: caddy:${WA_CADDY_TAG:-2.10-alpine}
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/world-assistant.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]/status"
    ports:
      - "${WA_API_PORT:-8010}:8000"
    networks: [internal]
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./deploy/proxy:/etc/caddy:ro
      - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/proxy:/live
    entrypoint:
      - sh
      - -c
      - |
        [ -s /live/upstreams.caddy ] || cp /etc/caddy/upstreams.default.caddy /live/upstreams.caddy
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    <<: *app
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/world-assistant.png"
    depends_on:
      migrate:
        condition: service_completed_successfully
      wa-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/worker.png"
    command: ["arq", "app.worker.WorkerSettings"]
    # Running jobs may finish when it is stopped (job_completion_wait in app/worker.py)
    stop_grace_period: 150s
    depends_on:
      migrate:
        condition: service_completed_successfully
      wa-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Updates this server: every night at 04:00 when automatic updates are on, and within a minute of "Update now" in
  # Settings (scripts/updater.sh runs scripts/auto-deploy.sh). It replaces the User Scripts the runbook used to set
  # up. It drives Docker on this server through its socket, which is full control of the server, so it publishes
  # no port and only installs releases whose signature checks out. Started by scripts/deploy.sh, which puts
  # COMPOSE_PROFILES=updater and WA_PROJECT_DIR in .env (WA_UPDATER=off in .env leaves it out).
  wa-updater:
    profiles: [updater]
    build: ./deploy/updater
    image: world-assistant-updater:local
    restart: unless-stopped
    networks: [internal]
    working_dir: ${WA_PROJECT_DIR:-/mnt/user/projects/world-assistant}
    command: ["bash", "scripts/updater.sh"]
    environment:
      TZ: ${TZ:-Europe/London}
      WA_IN_UPDATER: "1"
      AUTO_DEPLOY_API: http://wa-proxy:8000
      DOCKER_CONFIG: ${WA_DOCKER_CONFIG:-/root/.docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same paths as on the server, so compose finds the files and folders it names
      - ${WA_PROJECT_DIR:-/mnt/user/projects/world-assistant}:${WA_PROJECT_DIR:-/mnt/user/projects/world-assistant}
      - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}:${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}
      - ${WA_SECRETS_DIR:-/mnt/user/appdata/world-assistant/secrets}:${WA_SECRETS_DIR:-/mnt/user/appdata/world-assistant/secrets}:ro
      # The registry login for the release images (docker login ghcr.io on the server)
      - ${WA_DOCKER_CONFIG:-/root/.docker}:${WA_DOCKER_CONFIG:-/root/.docker}:ro

networks:
  internal: {}

secrets:
  # Kept outside this folder by default so the keys never sit in the shared share.
  postgres_password:
