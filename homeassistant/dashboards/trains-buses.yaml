# Train and bus departure boards, and the bus tracker. Finds every board; nothing to edit.
title: Trains and buses
views:
  - title: Trains and buses
    path: trains-buses
    icon: mdi:train
    cards:
      - type: markdown
        title: Departures
        content: |
          {% set ns = namespace(found=false) %}
          {% for s in states.sensor | sort(attribute='entity_id') if s.entity_id.startswith('sensor.wa_trains_') and s.entity_id.endswith('_next') %}{% set ns.found = true %}
          ### {{ s.name | replace('Trains and buses ', '') | replace(': next departure', '') }}
          {% if s.attributes.stale %}⚠️ Data is stale.
          {% endif %}{% if s.attributes.departures %}| Due | To | Plat | Status |
          |--:|:--|:-:|:--|{% for d in s.attributes.departures %}
          | {{ d.minutes }} min | {{ d.destination }} | {{ d.platform or '' }} | {{ ('🔴 ' if d.status in ['Cancelled'] else ('🟠 ' if (d.delay_minutes or 0) >= 5 else '🟢 ')) }}{{ d.status or '' }}{{ ' (+' ~ d.delay_minutes ~ ' min)' if (d.delay_minutes or 0) > 0 else '' }} |{% endfor %}
          {% else %}No services listed.
          {% endif %}{% endfor %}
          {% if not ns.found %}No boards yet. Set one up in World Assistant (Trains page).{% endif %}
      # Optional controls: they appear once homeassistant/packages/world_assistant_bus.yaml is installed.
      - type: conditional
        conditions:
          - condition: state
            entity: input_datetime.wa_bus_deadline
            state_not: unavailable
        card:
          type: entities
          title: Bus times
          show_header_toggle: false
          entities:
            - entity: input_datetime.wa_bus_deadline
            - entity: input_datetime.wa_bus_earliest
            - entity: input_datetime.wa_bus_show_until
      - type: conditional
        conditions:
          - condition: state
            entity: input_datetime.wa_bus_deadline
            state: unavailable
        card:
          type: markdown
          content: |
            To change the bus times from here, add homeassistant/packages/world_assistant_bus.yaml. The times
            World Assistant is using are in the chance line below.
      - type: markdown
        title: Bus tracker
        content: |
          {% set ns = namespace(found=false) %}
          {% for c in states.sensor | sort(attribute='entity_id') if c.entity_id.startswith('sensor.wa_bus_') and c.entity_id.endswith('_summary') %}{% set ns.found = true %}{% set base = c.entity_id[:-8] %}
          {% set nxt = states[base ~ '_next_board'] %}{% set chance = states[base ~ '_chance'] %}{% set rec = states[base ~ '_record'] %}{% set last = states[base ~ '_last_bus'] %}
          {% if nxt %}**Next bus at {{ nxt.name | replace('Next bus: ', '') }}**: {% if nxt.state not in ['unknown', 'unavailable'] %}{{ nxt.state }} min{% for r in nxt.attributes.next[1:] %}, then {{ r.minutes }}{% endfor %}{% if nxt.attributes.next and nxt.attributes.next[0].towards %} (towards {{ nxt.attributes.next[0].towards }}){% endif %}{% else %}none due{% endif %}
          {% endif %}{% if chance %}
          {% if chance.state not in ['unknown', 'unavailable', 'none'] %}**Chance of reaching the target by {{ chance.attributes.deadline }}**: {{ chance.state }}% for the {{ chance.attributes.bus }} bus (from {{ chance.attributes.based_on_days }} days, {{ chance.attributes.based_on }}){% for l in chance.attributes.later_buses %}
          - {{ l.slot }}: {{ l.chance if l.chance is not none else '?' }}%{% endfor %}
          {% elif chance.attributes.relevant and chance.attributes.days_recorded in [0, none] %}**Chance of reaching the target**: not enough history yet; it builds up as weekday mornings are recorded.
          {% else %}Chance of reaching the target: not shown ({{ chance.attributes.reason or 'no history yet' }}).
          {% endif %}{% endif %}
          {% if last %}{{ c.state }}
          {% endif %}{% if rec and rec.state not in ['unknown', 'unavailable', 'none'] %}
          **Record, last {{ rec.attributes.window_days }} days**: {{ rec.state }}% made it ({{ rec.attributes.success }} reached it, {{ rec.attributes.failure }} did not)
          {% for d in rec.attributes.recent_days %}- {{ d.date }}: {{ d.buses | join(', ') }}
          {% endfor %}{% endif %}{% set early = states[base ~ '_ended_early'] %}{% if early and early.state not in ['unknown', 'unavailable'] %}
          **Buses that ended early today**: {{ early.state }}{% for l in early.attributes.today %}
          - {{ l }}{% endfor %}{% for d in early.attributes.recent_days if d.date != now().date().isoformat() %}
          - {{ d.date }}: {{ d.count }}{% for l in d.buses %}; {{ l }}{% endfor %}{% endfor %}
          {% endif %}
          {% endfor %}
          {% if not ns.found %}No bus tracker is set up yet (World Assistant, Bus page). Trackers poll in their morning window, but the chance and the record are kept up to date all day.{% endif %}
