# The Leaf. The first view is what you need before driving; the diagnostics live on the second,
# where they are read once a month rather than every morning.
#
# "Before you go" is the point of the first view: it is silent unless something wants doing, so a
# glance is enough. Everything it can say is listed in docs/leaf.md.
#
# Entities come from the OVMS integration for HV66BZD, plus the local templates that convert to
# miles and psi (sensor.leaf_*_mi, sensor.leaf_tyre_pressure_*_psi). Nothing here needs World
# Assistant; drop it in as a dashboard of its own.
title: 2016 Leaf
views:
  - title: Leaf
    path: leaf
    icon: mdi:car-electric
    cards:
      - type: vertical-stack
        cards:
          - type: gauge
            entity: sensor.hv66bzd_instrument_soc_nissan_leaf
            name: Charge
            unit: '%'
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: glance
            show_name: true
            show_icon: true
            entities:
              - entity: sensor.wa_car_range_miles
                name: Range
              - entity: sensor.wa_car_full_charge_range
                name: Full charge
              - entity: sensor.leaf_odometer_mi
                name: Odometer

      - type: markdown
        title: Before you go
        content: |
          {% set ns = namespace(items=[]) %}
          {% set charging = is_state('binary_sensor.nissan_leaf_hv66bzd_charging_status', 'on') %}
          {% set plugged = is_state('binary_sensor.nissan_leaf_hv66bzd_charge_port', 'on') %}
          {% set soc = states('sensor.hv66bzd_instrument_soc_nissan_leaf') | float(-1) %}
          {% set miles = states('sensor.wa_car_range_miles') %}
          {% if plugged and not charging %}{% set ns.items = ns.items + ['🔌 Plugged in but not charging (' ~ states('sensor.nissan_leaf_hv66bzd_charge_substate') ~ ')'] %}{% endif %}
          {% if soc >= 0 and soc < 30 and not charging %}{% set ns.items = ns.items + ['🪫 Charge is ' ~ soc | round(0) | int ~ '%, about ' ~ miles ~ ' miles'] %}{% endif %}
          {% if is_state('lock.hv66bzd_vehicle_lock', 'unlocked') %}{% set ns.items = ns.items + ['🔓 Unlocked'] %}{% endif %}
          {% for d in [('front_left_door', 'Front left door'), ('front_right_door', 'Front right door'), ('rear_left_door', 'Rear left door'), ('rear_right_door', 'Rear right door'), ('trunk', 'Boot')] %}
          {% if is_state('binary_sensor.hv66bzd_' ~ d[0], 'on') %}{% set ns.items = ns.items + ['🚪 ' ~ d[1] ~ ' open'] %}{% endif %}
          {% endfor %}
          {% set v12 = states('sensor.hv66bzd_12v_battery_voltage') | float(-1) %}
          {% if is_state('binary_sensor.hv66bzd_12v_battery_voltage_alert', 'on') or (v12 >= 0 and v12 < 11.9 and not is_state('binary_sensor.hv66bzd_12v_battery_charging', 'on')) %}{% set ns.items = ns.items + ['⚠️ 12V battery at ' ~ v12 ~ 'V — this is what strands a Leaf'] %}{% endif %}
          {% if is_state('binary_sensor.nissan_leaf_hv66bzd_cell_voltage_alerts', 'on') %}{% set ns.items = ns.items + ['⚠️ Cell voltage alert'] %}{% endif %}
          {% if is_state('binary_sensor.nissan_leaf_hv66bzd_cell_temperature_alerts', 'on') %}{% set ns.items = ns.items + ['⚠️ Cell temperature alert'] %}{% endif %}
          {% for t in [('front_left', 'Front left'), ('front_right', 'Front right'), ('rear_left', 'Rear left'), ('rear_right', 'Rear right')] %}
          {% set p = states('sensor.leaf_tyre_pressure_' ~ t[0] ~ '_psi') | float(-1) %}
          {% if p >= 0 and (p < 33 or p > 40) %}{% set ns.items = ns.items + ['🛞 ' ~ t[1] ~ ' tyre ' ~ p ~ ' psi (36 recommended)'] %}{% endif %}
          {% endfor %}
          {% if ns.items %}{% for i in ns.items %}- {{ i }}
          {% endfor %}{% else %}Nothing to do.{% if charging %} Charging, {{ states('sensor.nissan_leaf_hv66bzd_time_to_full_charge') }} to full.{% else %} {{ soc | round(0) | int }}%, about {{ miles }} miles.{% endif %}{% endif %}

      - type: conditional
        conditions:
          - entity: binary_sensor.nissan_leaf_hv66bzd_charging_status
            state: 'on'
        card:
          type: entities
          title: Charging
          show_header_toggle: false
          entities:
            - entity: sensor.nissan_leaf_hv66bzd_time_to_full_charge
              name: Time to full
            - entity: sensor.nissan_leaf_hv66bzd_charge_energy
              name: Added this charge
            - entity: sensor.nissan_leaf_hv66bzd_charge_current
              name: Current
            - entity: sensor.nissan_leaf_hv66bzd_charge_voltage
              name: Voltage
            - entity: switch.nissan_leaf_hv66bzd_charge_control
              name: Charging

      - type: entities
        title: Climate
        show_header_toggle: false
        entities:
          - entity: switch.nissan_leaf_hv66bzd_climate_control
            name: Preheat
          - entity: sensor.nissan_leaf_hv66bzd_cabin_temperature
            name: Cabin
          - entity: sensor.nissan_leaf_hv66bzd_ambient_temperature
            name: Outside

      - type: map
        title: Where it is
        entities:
          - entity: device_tracker.hv66bzd_location
        default_zoom: 14
        theme_mode: auto
        hours_to_show: 24
      - type: markdown
        content: |
          The coloured trail is where the car has been over the last 24 hours, in the colour Home
          Assistant gives this car. It is the route driven, not a road condition. For just the
          current position and no trail, delete `hours_to_show` from the map card above.

      # Chargers near whoever is looking: their phone's location while away, else zone.home (as the Fuel dashboard).
      # Needs World Assistant's GRIDSERVE module; the connector picker comes with the EV chargers package.
      - type: markdown
        title: Chargers near you
        content: |
          {% set radius_km = 50 %}
          {% set me = states.person | selectattr('name', 'eq', user) | list %}{% set p = me[0] if me else none %}{% set away = p is not none and p.state not in ['home', 'unknown', 'unavailable'] and p.attributes.latitude is defined and p.attributes.latitude is not none and (p.attributes.gps_accuracy | default(0) | float(0)) <= 1000 %}{% set z = p if away else states.zone.home %}{% set where = 'your location' if away else 'home' %}
          {% set pick = states('input_select.wa_ev_connector') %}{% set mine = state_attr('sensor.wa_ev_summary', 'my_connector') %}{% set c = none if pick == 'Any' else pick if pick in ['CCS', 'CHAdeMO', 'Type 2'] else mine %}
          {% set ns = namespace(r=[]) %}
          {% for t in states.sensor if t.entity_id.startswith('sensor.wa_ev_tile_') %}{% for s in t.attributes.sites | default([]) %}{% set b = s.by.get(c) if c else [s.total, s.working, s.free, s.kw] %}{% if b and b[0] %}{% set d = distance(z.attributes.latitude, z.attributes.longitude, s.lat, s.lon) %}{% if d is not none and d <= radius_km %}{% set ns.r = ns.r + [[d, s.name, b[2], b[1], b[0], b[3], s.p, s.open, s.opens, s.broken]] %}{% endif %}{% endif %}{% endfor %}{% endfor %}
          {% if ns.r %}Within {{ radius_km }} km of {{ where }}{{ ', ' ~ c ~ ' only' if c else '' }}:
          {% for x in (ns.r | sort(attribute='0'))[:6] %}
          - **{{ x[1] }}**, {{ '%.1f' | format(x[0]) }} km: {% if x[7] == false %}closed now{{ ', opens ' ~ x[8] if x[8] else '' }}{% else %}{{ x[2] }} of {{ x[4] }} free{% endif %}{{ ', up to ' ~ (x[5] | int) ~ ' kW' if x[5] else '' }}{{ ', ' ~ (x[6] | round(0) | int) ~ 'p/kWh' if x[6] else '' }}{{ ', ' ~ (x[4] - x[3]) ~ ' not working' if x[3] < x[4] else '' }}{{ ' ⚠️ often has one out of order' if x[9] and x[9] > 0.5 else '' }}
          {% endfor %}{% elif states.sensor | selectattr('entity_id', 'search', '^sensor[.]wa_ev_tile_') | list %}No GRIDSERVE chargers within {{ radius_km }} km of {{ where }}{{ ' with ' ~ c if c else '' }}.{% else %}No charger data yet: World Assistant's GRIDSERVE module needs its key (gridserve_api_key).{% endif %}
      - type: entities
        title: Chargers
        show_header_toggle: false
        entities:
          - entity: input_select.wa_ev_connector
            name: Connector
          - entity: sensor.wa_nearest_free_charger
            name: Nearest free
          - entity: sensor.wa_chargers_near
            name: Measured from

  - title: Health
    path: leaf-health
    icon: mdi:battery-heart-variant
    cards:
      - type: entities
        title: Battery health
        show_header_toggle: false
        entities:
          - entity: sensor.nissan_leaf_hv66bzd_battery_health
            name: State of health
          - entity: sensor.hv66bzd_battery_hx_nissan_leaf
            name: Hx (degradation)
          - entity: sensor.hv66bzd_instrument_soh_nissan_leaf
            name: As the dashboard shows it
          - entity: sensor.nissan_leaf_hv66bzd_battery_capacity
            name: Capacity
          - entity: sensor.hv66bzd_available_energy_nissan_leaf
            name: Usable energy
          - entity: sensor.hv66bzd_gids_nissan_leaf
            name: Gids
          - entity: sensor.hv66bzd_maximum_gids_nissan_leaf
            name: Gids at this pack's best
      - type: markdown
        content: |
          Hx falls faster than state of health and is the earlier warning. Gids against the maximum is the
          same story in the pack's own units.
      - type: entities
        title: 12V battery
        show_header_toggle: false
        entities:
          - entity: sensor.hv66bzd_12v_battery_voltage
            name: Voltage
          - entity: sensor.hv66bzd_12v_battery_reference_voltage
            name: Reference
          - entity: binary_sensor.hv66bzd_12v_battery_charging
            name: Charging
      - type: markdown
        content: |
          Around 12.4V at rest is healthy and below 11.9V is not. It reads high whenever the car is awake
          or charging, so judge it when the car has been asleep a while.
      - type: entities
        title: Charges taken
        show_header_toggle: false
        entities:
          - entity: sensor.hv66bzd_l0_l1_l2_charge_count_nissan_leaf
            name: Slow and fast AC
          - entity: sensor.hv66bzd_quick_charge_count_nissan_leaf
            name: Rapid (CHAdeMO)
          - entity: sensor.nissan_leaf_hv66bzd_last_charge_end_time
            name: Last charge ended

      - type: entities
        title: Cells
        show_header_toggle: false
        entities:
          - entity: sensor.nissan_leaf_hv66bzd_battery_temperature
            name: Pack temperature
          - entity: sensor.nissan_leaf_hv66bzd_cell_temperature_minimum
            name: Coolest cell
          - entity: sensor.nissan_leaf_hv66bzd_cell_temperature_maximum
            name: Warmest cell
          - entity: sensor.nissan_leaf_hv66bzd_cell_voltage_minimum
            name: Lowest cell
          - entity: sensor.nissan_leaf_hv66bzd_cell_voltage_maximum
            name: Highest cell
          - entity: sensor.nissan_leaf_hv66bzd_cell_voltage_deviation
            name: Spread

      - type: entities
        title: Tyres
        show_header_toggle: false
        entities:
          - entity: sensor.leaf_tyre_pressure_front_left_psi
            name: Front left
          - entity: sensor.leaf_tyre_pressure_front_right_psi
            name: Front right
          - entity: sensor.leaf_tyre_pressure_rear_left_psi
            name: Rear left
          - entity: sensor.leaf_tyre_pressure_rear_right_psi
            name: Rear right
      - type: markdown
        content: |
          36 psi recommended. The first view says something only below 33 or above 40.
      - type: entities
        title: Distance
        show_header_toggle: false
        entities:
          - entity: sensor.leaf_odometer_mi
            name: Total
          - entity: sensor.leaf_trip_odometer_mi
            name: This trip
          - entity: sensor.nissan_leaf_hv66bzd_battery_energy_used_trip
            name: Used this trip
          - entity: sensor.nissan_leaf_hv66bzd_battery_energy_recovered_trip
            name: Recovered this trip

      - type: entities
        title: Doors and lock
        show_header_toggle: false
        entities:
          - entity: lock.hv66bzd_vehicle_lock
            name: Vehicle lock
          - entity: binary_sensor.hv66bzd_front_left_door
            name: Front left
          - entity: binary_sensor.hv66bzd_front_right_door
            name: Front right
          - entity: binary_sensor.hv66bzd_rear_left_door
            name: Rear left
          - entity: binary_sensor.hv66bzd_rear_right_door
            name: Rear right
          - entity: binary_sensor.hv66bzd_trunk
            name: Boot
          - entity: binary_sensor.hv66bzd_gps_lock
            name: GPS lock
