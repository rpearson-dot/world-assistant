# What's on near Home Assistant's home zone (8 km, next 7 days). Needs
# homeassistant/packages/world_assistant.yaml; change the radius and days there.
title: Events
views:
  - title: Events
    path: events
    icon: mdi:calendar-star
    cards:
      - type: entities
        title: At a glance
        entities:
          - entity: sensor.wa_events_upcoming
            name: Events coming up
          - entity: sensor.wa_events_next
            name: Next event
      - type: markdown
        title: Coming up
        content: |
          {% set events = state_attr('sensor.wa_events_upcoming', 'events') %}
          {% if events %}
          | Date | Event | Venue | Away | Price |
          |:--|:--|:--|--:|:--|{% for e in events %}
          | {{ e.date or '' }}{{ ' ' ~ e.doors_open if e.doors_open else '' }} | **{{ e.name }}** | {{ e.venue or '' }}{{ ', ' ~ e.town if e.town else '' }} | {{ ('%.1f km' % e.distance_km) if e.distance_km is not none else '' }} | {{ e.price or '' }} |{% endfor %}
          {% else %}Nothing listed in the next {{ state_attr('sensor.wa_events_upcoming', 'days') or 7 }} days, or the World Assistant package is not installed yet (docs/home-assistant.md).{% endif %}
