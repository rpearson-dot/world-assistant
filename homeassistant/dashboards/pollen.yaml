# Pollen for Home Assistant's home zone. Needs homeassistant/packages/world_assistant.yaml.
title: Pollen
views:
  - title: Pollen
    path: pollen
    icon: mdi:flower-pollen
    cards:
      - type: gauge
        entity: sensor.wa_pollen_allergy_risk
        name: Allergy risk today
        min: 0
        max: 10
        needle: true
        severity:
          green: 0
          yellow: 3
          red: 6
      - type: markdown
        title: Pollen this week
        content: |
          {% set bars = ['⬜', '🟩', '🟨', '🟧', '🟥'] %}
          {% set dates = state_attr('sensor.wa_pollen_allergy_risk', 'dates') or [] %}
          {% set allergens = state_attr('sensor.wa_pollen_allergy_risk', 'allergens') or [] %}
          {% if dates %}Allergy risk today: **{{ (state_attr('sensor.wa_pollen_allergy_risk', 'allergy_risk_label') or ['unknown'])[0] or 'unknown' }}** ({{ states('sensor.wa_pollen_allergy_risk') }}/10)

          | |{% for d in dates %} {{ as_datetime(d).strftime('%a') }} |{% endfor %}
          |:--|{% for d in dates %}:-:|{% endfor %}{% for a in allergens %}
          | **{{ a.name }}** |{% for lv in (a.levels or []) %} {{ bars[lv | int(0)] if lv is not none else '▫️' }} |{% endfor %}{% endfor %}

          ⬜ none 🟩 low 🟨 moderate 🟧 high 🟥 very high
          {% else %}No pollen data yet. Check the World Assistant package is installed (docs/home-assistant.md).{% endif %}
      - type: history-graph
        title: Last 30 days
        hours_to_show: 720
        entities:
          - entity: sensor.wa_pollen_allergy_risk
            name: Allergy risk
          - entity: sensor.wa_pollen_alder
            name: Alder
          - entity: sensor.wa_pollen_birch
            name: Birch
          - entity: sensor.wa_pollen_grasses
            name: Grasses
          - entity: sensor.wa_pollen_mugwort
            name: Mugwort
          - entity: sensor.wa_pollen_olive
            name: Olive
          - entity: sensor.wa_pollen_ragweed
            name: Ragweed
