# World Assistant energy plan for Home Assistant: charges the battery in your tariff's cheap windows, as much as the
# house needs until the next one, on a Deye/Sunsynk-style inverter with six daily time slots.
#
# ANY TARIFF: World Assistant works out the six slots from your real Octopus rates (sensor.wa_energy_charge_schedule):
# a slot starts at each cheap window (grid charge on) and at each window's end (off), up to three windows a day.
# On Cosy that is 00:00 04:00 07:00 13:00 16:00 22:00 with grid charge on 04:00, 13:00 and 22:00; on Go one window
# overnight; on Agile the cheapest windows of the coming day, so the slots move from day to day.
#
# SLOT TIMES: with "WA energy plan: set slot times from the tariff" ON (and the plan applying), the inverter's slot
# start times and grid-charge switches are written from that schedule. OFF (the default), they are left as they are
# and the plan only applies when they already match ("WA inverter slot check"), as before.
#
# CHARGE RATE: a window can only add so much: the inverter's grid charge rate (its grid charge current, or the
# battery's maximum if lower, times the battery voltage, no more than the inverter's rating; "WA battery charge rate
# from the grid" if those cannot be read) times the window's hours. When a window cannot put back all the next
# stretch needs, the window before it charges higher to make up the difference ("WA battery charge rate").
#
# TARGETS: each charging slot is charged to the battery floor plus what the house uses from the end of its window to
# the start of the next one (your night 00-07, day 07-16 and evening 16-24 loads, with a safety margin), less the
# Forecast.Solar production expected in that time, never above the battery health max. When more is wanted than the
# health max, the plan stops there and suggests raising it. The other slots are set to the battery floor: their
# target is how low the inverter lets the battery discharge. Checked every 15 minutes and whenever the schedule
# changes; a target is only rewritten when it moves by 5% or more.
#
# SAVING SESSIONS: a joined session in the time a charging slot covers raises that slot's target (a bigger margin
# and a higher floor). A joined session inside a charging window is warned about (it would import). During a joined
# session a notification is sent if the battery gets low. Nothing here switches the grid off: the inverter takes any
# shortfall from the grid itself, so the cost is a smaller reward, never a loss of supply.
#
# FREE ELECTRICITY: one minute before a Free Electricity hour you have joined, the slot it falls in charges from the
# grid to "WA target during free electricity" (never above the health max), so the house runs from the grid and the
# battery fills for free; the slot is put back when the hour ends. A charging slot before a joined free hour only
# covers the time up to it.
#
# DRY RUN FIRST: "WA energy plan: apply to inverter" starts OFF. While off, every change the plan would make is
# written to the logbook instead. Compare it with what you would choose, then switch it on.
#
# Install: from World Assistant's Home Assistant page (/ha), where your inverter's entity name is filled in: download
# it, or copy it over Samba, to /config/packages/wa_energy_plan.yaml; configuration.yaml needs
#   homeassistant:
#     packages: !include_dir_named packages
# then Developer tools > YAML > Check configuration, and restart Home Assistant. Needs World Assistant 0.20 or later
# (the charge schedule) and Forecast.Solar (sensor.energy_production_today / _tomorrow; without it solar counts as
# zero, which only means buying a little more than necessary).
#
# Tune the defaults below to your house (edit the file; "initial" is applied at every restart).

input_boolean:
  wa_energy_plan_apply:
    name: "WA energy plan: apply to inverter"
    icon: mdi:battery-sync
  wa_energy_plan_manage_slots:
    name: "WA energy plan: set slot times from the tariff"
    icon: mdi:timetable

input_text:
  wa_free_restore:
    name: "WA free electricity: settings to put back"
    max: 255
  wa_plan_last:
    name: "WA energy plan: last logged"
    max: 255

input_number:
  wa_free_target_pct:
    # Free hours fill to this, but never above the battery health max (raise both to go higher)
    name: "WA target during free electricity"
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 100
  wa_battery_kwh:
    name: "WA battery usable capacity"
    min: 5
    max: 60
    step: 0.5
    unit_of_measurement: kWh
    initial: 40
  wa_floor_pct:
    # The lowest the battery may go. Every target is this plus what the house needs, and the non-charging slots are
    # set to it, which is how low the inverter lets the battery discharge there.
    name: "WA battery floor"
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    initial: 20
  wa_min_target_pct:
    name: "WA lowest charge target"
    min: 10
    max: 90
    step: 5
    unit_of_measurement: "%"
    initial: 25
  wa_max_target_pct:
    # Long-term battery health: the plan never charges above this. When the house would need more before the next
    # cheap window, the plan still stops here and suggests raising it (a notification, the dashboard, the logbook).
    name: "WA battery health max charge"
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 80
  wa_margin:
    name: "WA safety margin on expected use"
    min: 1
    max: 2
    step: 0.05
    initial: 1.25
  wa_night_load_kw:
    name: "WA average load 00:00-07:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 0.6
  wa_morning_load_kw:
    name: "WA average load 07:00-16:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 1.2
  wa_evening_load_kw:
    name: "WA average load 16:00-24:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 2.0
  wa_charge_kw:
    # Used only when the inverter's grid charge current, battery voltage or rating cannot be read
    name: "WA battery charge rate from the grid"
    min: 0.5
    max: 15
    step: 0.1
    unit_of_measurement: kW
    initial: 5.0
  wa_solar_trust:
    # How much of Forecast.Solar's forecast to count on (1 = all of it)
    name: "WA share of the solar forecast to count on"
    min: 0
    max: 1
    step: 0.05
    initial: 0.8
  wa_session_margin:
    name: "WA safety margin when a joined session is due"
    min: 1
    max: 3
    step: 0.05
    initial: 1.5
  wa_session_extra_floor_pct:
    name: "WA extra reserve when a joined session is due"
    min: 0
    max: 40
    step: 5
    unit_of_measurement: "%"
    initial: 10
  wa_session_low_soc_pct:
    name: "WA warn if battery falls below this in a session"
    min: 5
    max: 60
    step: 1
    unit_of_measurement: "%"
    initial: 20

template:
  - sensor:
      # Do the inverter's slots match World Assistant's schedule? A slot borrowed by a Free Electricity hour is not
      # checked for its grid-charge switch.
      - name: "WA inverter slot check"
        unique_id: wa_inverter_slot_check
        icon: mdi:timetable
        state: >-
          {% set sched = state_attr('sensor.wa_energy_charge_schedule', 'slots') or [] %}
          {% set r = states('input_text.wa_free_restore') %}
          {% set borrowed = (r | from_json).slot if r.startswith('{') else 0 %}
          {% set ns = namespace(bad=0, unknown=0) %}
          {% for s in sched %}
            {% set t = states('text.office_inverter_time_slot_' ~ s.n ~ '_start') %}
            {% if t in ['unknown', 'unavailable'] %}{% set ns.unknown = ns.unknown + 1 %}
            {% elif t[:5] != s.start %}{% set ns.bad = ns.bad + 1 %}{% endif %}
            {% set sw = states('switch.office_inverter_time_slot_' ~ s.n ~ '_on') %}
            {% if sw in ['unknown', 'unavailable'] %}{% set ns.unknown = ns.unknown + 1 %}
            {% elif s.n != borrowed and (sw == 'on') != s.charge %}{% set ns.bad = ns.bad + 1 %}{% endif %}
          {% endfor %}
          {{ 'no schedule' if sched | length != 6 else 'mismatch' if ns.bad else ('unchecked' if ns.unknown else 'ok') }}
        attributes:
          problems: >-
            {% set sched = state_attr('sensor.wa_energy_charge_schedule', 'slots') or [] %}
            {% set r = states('input_text.wa_free_restore') %}
            {% set borrowed = (r | from_json).slot if r.startswith('{') else 0 %}
            {% set ns = namespace(out=[]) %}
            {% for s in sched %}
              {% set t = states('text.office_inverter_time_slot_' ~ s.n ~ '_start') %}
              {% if t not in ['unknown', 'unavailable'] and t[:5] != s.start %}
                {% set ns.out = ns.out + ['slot ' ~ s.n ~ ' starts ' ~ t[:5] ~ ', the tariff wants ' ~ s.start] %}{% endif %}
              {% set sw = states('switch.office_inverter_time_slot_' ~ s.n ~ '_on') %}
              {% if sw in ['on', 'off'] and s.n != borrowed and (sw == 'on') != s.charge %}
                {% set ns.out = ns.out + ['slot ' ~ s.n ~ ' grid charge is ' ~ sw ~ ', the tariff wants ' ~ ('on' if s.charge else 'off')] %}{% endif %}
            {% endfor %}
            {{ ns.out | join('; ') }}

      # How fast the inverter can charge the battery from the grid: grid charge current (or the battery's maximum, if
      # lower) x battery voltage, no more than the inverter's rating, less 5% losses.
      - name: "WA battery charge rate"
        unique_id: wa_battery_charge_rate
        unit_of_measurement: kW
        icon: mdi:battery-arrow-up
        state: >-
          {% set a = states('number.office_inverter_grid_charge_current') | float(0) %}
          {% set b = states('number.office_inverter_battery_max_charge_current') | float(0) %}
          {% set v = states('sensor.office_inverter_battery_voltage') | float(0) %}
          {% set rated = states('sensor.office_inverter_rated_power') | float(0) / 1000 %}
          {% set amps = [a, b] | select('>', 0) | min if a > 0 or b > 0 else 0 %}
          {% set kw = amps * v / 1000 %}
          {% set kw = [kw, rated] | min if rated > 0 and kw > 0 else kw %}
          {{ (kw * 0.95) | round(1) if kw > 0 else states('input_number.wa_charge_kw') | float(5) }}
        attributes:
          from_inverter: "{{ states('number.office_inverter_grid_charge_current') | float(0) > 0 and states('sensor.office_inverter_battery_voltage') | float(0) > 0 }}"

      # Each slot's target: what the house needs until the next cheap window, as a charge level. A window that cannot
      # put back all the next stretch needs (charge rate x its hours) makes the window before it charge higher.
      - name: "WA charge targets"
        unique_id: wa_charge_targets
        icon: mdi:battery-charging
        state: "{{ states('sensor.wa_energy_charge_schedule') }}"
        attributes:
          slots: >-
            {% set sched = state_attr('sensor.wa_energy_charge_schedule', 'slots') or [] %}
            {% set cap = states('input_number.wa_battery_kwh') | float(40) %}
            {% set floor = states('input_number.wa_floor_pct') | float(20) %}
            {% set lo = states('input_number.wa_min_target_pct') | float(25) %}
            {% set hi = states('input_number.wa_max_target_pct') | int(80) %}
            {% set rate = states('sensor.wa_battery_charge_rate') | float(5) %}
            {% set today = states('sensor.energy_production_today') | float(0) %}
            {% set tomorrow = states('sensor.energy_production_tomorrow') | float(0) %}
            {% set trust = states('input_number.wa_solar_trust') | float(0.8) %}
            {# each charging window once: what its stretch uses (net of solar) and what it can add, as % #}
            {% set ns = namespace(win=[], seen=[], want=[], out=[], i=0) %}
            {% for s in sched if s.charge and s.window not in ns.seen %}
              {% set ns.seen = ns.seen + [s.window] %}
              {% set m = states('input_number.wa_session_margin') | float(1.5) if s.session
                         else states('input_number.wa_margin') | float(1.25) %}
              {% set extra = states('input_number.wa_session_extra_floor_pct') | float(10) if s.session else 0 %}
              {% set use = (s.load_hours.night * states('input_number.wa_night_load_kw') | float(0.6)
                            + s.load_hours.day * states('input_number.wa_morning_load_kw') | float(1.2)
                            + s.load_hours.evening * states('input_number.wa_evening_load_kw') | float(2)) * m %}
              {% set sun = trust * (s.solar_share.today * today + s.solar_share.tomorrow * tomorrow) %}
              {% set net = [use - sun, 0] | max / cap * 100 %}
              {% set ns.win = ns.win + [{'w': s.window, 'net': net, 'extra': extra, 'add': rate * s.window_hours / cap * 100,
                                         'use': use | round(1), 'sun': sun | round(1)}] %}
              {% set ns.want = ns.want + [floor + extra + net] %}
            {% endfor %}
            {# walk back round the windows twice: each must start high enough for the next to reach its level #}
            {% set k = ns.win | length %}
            {% for step in range(2 * k) %}
              {% set i = (k - 1 - step) % k %}
              {% set nx = (i + 1) % k %}
              {% set start_needed = [floor + ns.win[i].extra, ns.want[nx] - ns.win[nx].add] | max %}
              {% set v = [[ns.want[i], start_needed + ns.win[i].net] | max, 100] | min %}
              {% set ns.want = ns.want[:i] + [v] + ns.want[i + 1:] %}
            {% endfor %}
            {% for s in sched %}
              {% if s.charge %}
                {% for x in ns.win %}{% if x.w == s.window %}{% set ns.i = loop.index0 %}{% endif %}{% endfor %}
                {% set i = ns.i %}
                {% set w = ns.win[i] %}
                {% set wanted = [[(ns.want[i] / 5) | round(0) * 5, lo] | max, 100] | min | int %}
                {% set ns.out = ns.out + [{'n': s.n, 'start': s.start, 'end': s.end, 'charge': true,
                                           'covers': s.cover_from ~ '-' ~ s.cover_to, 'use_kwh': w.use, 'solar_kwh': w.sun,
                                           'adds_up_to': w.add | round(0) | int, 'session': s.session,
                                           'carried': ns.want[i] > floor + w.extra + w.net + 0.5,
                                           'wanted': wanted, 'target': [wanted, hi] | min, 'over': wanted > hi}] %}
              {% else %}
                {% set ns.out = ns.out + [{'n': s.n, 'start': s.start, 'end': s.end, 'charge': false,
                                           'wanted': floor | int, 'target': floor | int, 'over': false}] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}

automation:
  - id: wa_energy_plan
    alias: "WA energy plan: set the inverter's slots and targets"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id: sensor.wa_energy_charge_schedule
        attribute: slots
      - trigger: state
        entity_id:
          - input_boolean.wa_energy_plan_apply
          - input_boolean.wa_energy_plan_manage_slots
        to: "on"
    variables:
      sched: "{{ state_attr('sensor.wa_energy_charge_schedule', 'slots') or [] }}"
      apply: >-
        {{ is_state('input_boolean.wa_energy_plan_apply', 'on') and is_state('switch.office_inverter_allow_remote_control', 'on') }}
      manage: "{{ is_state('input_boolean.wa_energy_plan_manage_slots', 'on') }}"
      borrowed: >-
        {% set r = states('input_text.wa_free_restore') %}
        {{ (r | from_json).slot if r.startswith('{') else 0 }}
      # slot times to write: those moving earlier in slot order, then those moving later in reverse, so the start
      # times stay in order on the inverter throughout
      earlier: >-
        {% set ns = namespace(out=[]) %}
        {% for s in sched %}{% set t = states('text.office_inverter_time_slot_' ~ s.n ~ '_start')[:5] %}
          {% if t not in ['unkno', 'unava'] and s.start < t %}{% set ns.out = ns.out + [{'n': s.n, 'start': s.start}] %}{% endif %}
        {% endfor %}{{ ns.out }}
      later: >-
        {% set ns = namespace(out=[]) %}
        {% for s in sched | reverse %}{% set t = states('text.office_inverter_time_slot_' ~ s.n ~ '_start')[:5] %}
          {% if t not in ['unkno', 'unava'] and s.start > t %}{% set ns.out = ns.out + [{'n': s.n, 'start': s.start}] %}{% endif %}
        {% endfor %}{{ ns.out }}
      switches: >-
        {% set ns = namespace(out=[]) %}
        {% for s in sched %}{% set sw = states('switch.office_inverter_time_slot_' ~ s.n ~ '_on') %}
          {% if sw in ['on', 'off'] and s.n != borrowed and (sw == 'on') != s.charge %}
            {% set ns.out = ns.out + [{'n': s.n, 'on': s.charge}] %}{% endif %}
        {% endfor %}{{ ns.out }}
    conditions:
      - condition: template
        value_template: "{{ sched | length == 6 }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ apply and manage and (earlier or later or switches) }}"
        then:
          - repeat:
              for_each: "{{ earlier + later }}"
              sequence:
                - action: text.set_value
                  target:
                    entity_id: "text.office_inverter_time_slot_{{ repeat.item.n }}_start"
                  data:
                    value: "{{ repeat.item.start }}"
                - delay: "00:00:05"
          - repeat:
              for_each: "{{ switches }}"
              sequence:
                - action: "switch.turn_{{ 'on' if repeat.item.on else 'off' }}"
                  target:
                    entity_id: "switch.office_inverter_time_slot_{{ repeat.item.n }}_on"
                - delay: "00:00:05"
          - action: logbook.log
            data:
              name: WA energy plan
              entity_id: input_boolean.wa_energy_plan_apply
              message: >-
                Slots set from the tariff ({{ states('sensor.wa_energy_charge_schedule') }}):
                {{ sched | map(attribute='start') | join(', ') }}, grid charge on
                {{ sched | selectattr('charge') | map(attribute='n') | map('string') | join(', ') }}.
          - delay: "00:00:20"
      # targets: written only when the inverter's slots match the schedule
      - variables:
          check: "{{ states('sensor.wa_inverter_slot_check') }}"
          targets: "{{ state_attr('sensor.wa_charge_targets', 'slots') or [] }}"
          changes: >-
            {% set ns = namespace(out=[]) %}
            {% for t in targets if t.n != borrowed %}
              {% set now_pct = states('number.office_inverter_time_slot_' ~ t.n ~ '_capacity') | int(-1) %}
              {% if now_pct >= 0 and ((t.charge and (t.target - now_pct) | abs >= 5) or (not t.charge and t.target != now_pct)) %}
                {% set ns.out = ns.out + [{'n': t.n, 'start': t.start, 'charge': t.charge, 'to': t.target, 'from': now_pct}] %}
              {% endif %}
            {% endfor %}{{ ns.out }}
          signature: >-
            {{ check }} {{ apply }} {{ changes | map(attribute='n') | map('string') | join('') }}
            {{- changes | map(attribute='to') | map('string') | join('.') }}
      - if:
          - condition: template
            value_template: "{{ apply and check != 'mismatch' and changes | length > 0 }}"
        then:
          - repeat:
              for_each: "{{ changes }}"
              sequence:
                - action: number.set_value
                  target:
                    entity_id: "number.office_inverter_time_slot_{{ repeat.item.n }}_capacity"
                  data:
                    value: "{{ repeat.item.to }}"
                - delay: "00:00:05"
      # the logbook: once for each new plan, not every 15 minutes
      - if:
          - condition: template
            value_template: "{{ changes | length > 0 and states('input_text.wa_plan_last') != signature[:255] }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.wa_plan_last
            data:
              value: "{{ signature[:255] }}"
          - action: logbook.log
            data:
              name: WA energy plan
              entity_id: input_boolean.wa_energy_plan_apply
              message: >-
                {% set parts = changes | map(attribute='start') | list %}
                {%- for c in changes %}{{ 'Slot ' ~ c.n ~ ' (' ~ c.start ~ (', charging' if c.charge else '') ~ ') '
                ~ c.from ~ '% to ' ~ c.to ~ '%' }}{{ '; ' if not loop.last else '. ' }}{% endfor %}
                {%- if check == 'mismatch' %}Not applied: the inverter's slots differ from the tariff ({{ state_attr('sensor.wa_inverter_slot_check', 'problems') }}).
                {%- if not manage %} Switch on "set slot times from the tariff" to let the plan change them.{% endif %}
                {%- elif apply %}Applied.
                {%- elif is_state('input_boolean.wa_energy_plan_apply', 'on') %}Not applied: the inverter's remote control is
                {{ 'missing' if states('switch.office_inverter_allow_remote_control') in ['unknown', 'unavailable'] else 'off' }}
                (switch.office_inverter_allow_remote_control); turn it on to let the plan change the slots.
                {%- else %}Dry run: nothing changed.{% endif %}
                {%- if check == 'unchecked' %} (Slot times could not be read, so they were not checked.){% endif %}

  - id: wa_energy_health_max_suggestion
    alias: "WA energy plan: suggest raising the battery health max when the house needs more"
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ (state_attr('sensor.wa_charge_targets', 'slots') or []) | selectattr('over') | list | length > 0 }}"
    variables:
      capped: >-
        {% set ns = namespace(out=[]) %}
        {% for t in (state_attr('sensor.wa_charge_targets', 'slots') or []) | selectattr('over') %}
          {% set ns.out = ns.out + ['slot ' ~ t.n ~ ' (' ~ t.start ~ ', for ' ~ t.covers ~ ') wants ' ~ t.wanted ~ '%'] %}
        {% endfor %}
        {{ ns.out | join('; ') }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: wa_health_max
          title: "Battery: more needed than the health max"
          message: >-
            {{ capped }}, above your battery health max of {{ states('input_number.wa_max_target_pct') | int }}%.
            The plan charges to {{ states('input_number.wa_max_target_pct') | int }}%, so the rest will be bought at a
            dearer rate before the next cheap window. To cover it, raise "WA battery health max charge" on the Home
            charging dashboard.
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: "Capped at the battery health max: {{ capped }}. Raise it to cover this."

  - id: wa_energy_schedule_warnings
    alias: "WA energy plan: warn about a joined Saving Session in a charging window"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.wa_energy_charge_schedule
        attribute: warnings
    conditions:
      - condition: template
        value_template: "{{ (state_attr('sensor.wa_energy_charge_schedule', 'warnings') or []) | length > 0 }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: wa_schedule_warning
          title: "Energy plan"
          message: "{{ state_attr('sensor.wa_energy_charge_schedule', 'warnings') | join(' ') }}"

  - id: wa_energy_session_low_battery
    alias: "WA energy plan: warn if the battery runs low in a joined Saving Session"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.office_inverter_battery_soc
        below: input_number.wa_session_low_soc_pct
    conditions:
      - condition: state
        entity_id: sensor.wa_energy_saving_session_now
        state: "on"
      - condition: template
        value_template: "{{ state_attr('sensor.wa_energy_saving_session_now', 'joined') == true }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Saving Session: battery is low"
          message: >-
            Battery is at {{ states('sensor.office_inverter_battery_soc') }}% during a joined Saving Session that ends
            at {{ state_attr('sensor.wa_energy_saving_session_now', 'end') }}. The inverter will take any shortfall
            from the grid, so the house stays supplied, but the reward shrinks.

  - id: wa_energy_free_start
    alias: "WA energy plan: a joined Free Electricity hour starts (charge from the grid)"
    mode: queued
    triggers:
      - trigger: time
        at:
          entity_id: sensor.wa_energy_free_electricity_next_start
          offset: "-00:01:00"
    variables:
      start: "{{ states('sensor.wa_energy_free_electricity_next_start') }}"
      end: "{{ state_attr('sensor.wa_energy_free_electricity_next_start', 'end') }}"
      joined: "{{ state_attr('sensor.wa_energy_free_electricity_next_start', 'joined') == true }}"
      # the slot the hour falls in, from the inverter's own start times (before slot 1's start is the last slot)
      slot: >-
        {% set t = (as_datetime(start) | as_local).strftime('%H:%M') %}
        {% set ns = namespace(slot=6) %}
        {% for n in range(1, 7) %}
          {% set s = states('text.office_inverter_time_slot_' ~ n ~ '_start')[:5] %}
          {% if s not in ['unkno', 'unava'] and s <= t %}{% set ns.slot = n %}{% endif %}
        {% endfor %}
        {{ ns.slot }}
      target: >-
        {{ [states('input_number.wa_free_target_pct') | int(100), states('input_number.wa_max_target_pct') | int(80)] | min }}
      cap_now: "{{ states('number.office_inverter_time_slot_' ~ slot ~ '_capacity') | int(0) }}"
      on_now: "{{ states('switch.office_inverter_time_slot_' ~ slot ~ '_on') }}"
      saved: >-
        {% set r = states('input_text.wa_free_restore') %}
        {{ r | from_json if r.startswith('{') else {} }}
      apply: >-
        {{ is_state('input_boolean.wa_energy_plan_apply', 'on') and is_state('switch.office_inverter_allow_remote_control', 'on') }}
    conditions:
      - condition: template
        value_template: "{{ joined and end not in [none, ''] and on_now in ['on', 'off'] }}"
    actions:
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Free Electricity {{ (as_datetime(start) | as_local).strftime('%H:%M') }}-{{ (as_datetime(end) | as_local).strftime('%H:%M') }}
            ({{ state_attr('sensor.wa_energy_free_electricity_next_start', 'type') or 'joined' }}): slot {{ slot }} to
            {{ target }}% with grid charge on (now {{ cap_now }}%, grid charge {{ on_now }}).
            {% if apply %}Applying; put back at {{ (as_datetime(end) | as_local).strftime('%H:%M') }}.
            {% elif is_state('input_boolean.wa_energy_plan_apply', 'on') %}Not applied: the inverter's remote control is off.
            {% else %}Dry run: nothing changed.{% endif %}
      - if:
          - condition: template
            value_template: "{{ apply }}"
        then:
          # an hour straight after another in a different slot: put that slot back first
          - if:
              - condition: template
                value_template: "{{ saved.slot is defined and saved.slot | string != slot | string }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "number.office_inverter_time_slot_{{ saved.slot }}_capacity"
                data:
                  value: "{{ saved.cap }}"
              - delay: "00:00:10"
              - action: "switch.turn_{{ saved.on }}"
                target:
                  entity_id: "switch.office_inverter_time_slot_{{ saved.slot }}_on"
              - delay: "00:00:10"
          # keep what was there before the first of back-to-back hours in the same slot
          - action: input_text.set_value
            target:
              entity_id: input_text.wa_free_restore
            data:
              value: >-
                {% set same = saved.slot is defined and saved.slot | string == slot | string %}
                {{ {'slot': slot | int, 'cap': saved.cap if same else cap_now, 'on': saved.on if same else on_now,
                    'end': end} | to_json }}
          - action: number.set_value
            target:
              entity_id: "number.office_inverter_time_slot_{{ slot }}_capacity"
            data:
              value: "{{ target }}"
          - delay: "00:00:10"
          - action: switch.turn_on
            target:
              entity_id: "switch.office_inverter_time_slot_{{ slot }}_on"

  - id: wa_energy_free_end
    alias: "WA energy plan: the Free Electricity hour is over (put the slot back)"
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set r = states('input_text.wa_free_restore') %}
          {{ r.startswith('{') and now() >= as_datetime((r | from_json).end) }}
      - trigger: homeassistant
        event: start
    variables:
      saved: >-
        {% set r = states('input_text.wa_free_restore') %}
        {{ r | from_json if r.startswith('{') else {} }}
    conditions:
      - condition: template
        value_template: "{{ saved.slot is defined and now() >= as_datetime(saved.end) }}"
    actions:
      - action: number.set_value
        target:
          entity_id: "number.office_inverter_time_slot_{{ saved.slot }}_capacity"
        data:
          value: "{{ saved.cap }}"
      - delay: "00:00:10"
      - action: "switch.turn_{{ saved.on }}"
        target:
          entity_id: "switch.office_inverter_time_slot_{{ saved.slot }}_on"
      - action: input_text.set_value
        target:
          entity_id: input_text.wa_free_restore
        data:
          value: ""
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Free Electricity over: slot {{ saved.slot }} put back to {{ saved.cap }}% with grid charge {{ saved.on }}.
