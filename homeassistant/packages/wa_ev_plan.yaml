# World Assistant car charging plan for Home Assistant: charges the car only when electricity is cheap or free, and
# stops at your target, through an OCPP charger (Home Assistant's OCPP integration) and, if you have it, the car's
# charge level (from OVMS, or any other integration).
#
# WHEN IT CHARGES: the car is plugged in, below "WA car: charge to", and one of:
#   - the electricity rate is cheap now: World Assistant's live rate band (sensor.wa_energy_cheap_now), which
#     follows your tariff as it is (Cosy's windows, Go's night, Agile's cheap half hours as they move), or a
#     charging window of the energy plan is on;
#   - a Free Electricity hour you joined is on (sensor.wa_energy_free_electricity_now);
#   - "WA car: always charge when low" is on and the car is below "WA car: low means below";
#   - "WA car: also charge from the house battery" is on and the house battery is at or above "WA car: house battery
#     above" (once charging this way, it carries on until the battery is 5% below that), at "WA car: current from the
#     house battery": about 2.3 kW at 10 A, which the battery can cover without buying from the grid.
# CURRENT: if the charger lets Home Assistant set its maximum current (number.charger_maximum_current in the OCPP
# integration: only chargers that offer OCPP Smart Charging have it), the plan sets it: "WA car: current from the
# house battery" when charging from the battery, and "WA car: charge current" otherwise (0 leaves it as it is).
# Without that entity (or while it is unavailable) the charger runs at its own maximum and charging from the house
# battery is not started, since it could not be held to the battery's rate.
# RESTING WHEN FULL: once charging stops because the car reached its target, it is not started again for "WA car:
# rest after full" (60 minutes or more), unless the car drops more than 5% below the target. The car's reading
# often slips a point after a charge stops, which would otherwise start it again within minutes, over and over.
# A stop is sent once; while the charger still shows on but is not charging, it is not sent again for 30 minutes.
# LEAVING ROOM FOR FREE ELECTRICITY: with "WA car: leave room per free hour" above 0, cheap charging stops that much
# below the target for each Free Electricity hour you joined in the next 24 hours, and the free hour fills the rest.
# One hour at 4.6 kW is about 4.6 kWh: roughly 20% of a 24 kWh (usable) battery. 0 (the default) leaves no room.
# Otherwise charging is stopped.
# WHEN THE CAR GOES QUIET: the car's charge level often stops arriving while it charges (OVMS asleep, no signal, or an
# integration update that renamed the entity). The plan then works from the last level it was told, plus an estimate
# of what the charger has added since (its power, or the current it was set to, into "WA car: usable battery"), so
# the target still holds. Only with no level ever seen does it charge until the car stops by itself, and it says so.
# NOT STARTING: if the charger's switch shows on but the charger sits ready ("Preparing" or "SuspendedEVSE") for 10
# minutes while the plan wants to charge, the start is sent again (off, then on), at most every 30 minutes. The
# switch can stay on after the last charge, and while it shows on no new start was ever sent.
#
# YOUR ENTITIES: set them on the Home charging dashboard (Car settings), or in Settings > Helpers, "WA car: ..."
# entity fields. Left empty, the names below are used (a Sync EV charger named "charger" in the OCPP integration and
# an OVMS Nissan Leaf). The plan reads them through its own sensors (sensor.wa_car_*, sensor.wa_charger_*), so the
# dashboard and the energy plan's outcome log follow whatever you set.
#
# WORLD ASSISTANT'S OCPP SERVER: when the charger is connected to World Assistant instead of Home Assistant's OCPP
# integration, its entities (switch.wa_ocpp_charging, sensor.wa_ocpp_status, _power, _session_energy, _energy) are
# used automatically, unless the entity fields below name others.
# HOW: the charger's charge control switch (OCPP remote start/stop), checked every 5 minutes and whenever the rate,
# a free hour, the plug or the car's charge level changes. The current is set as above, before each start. Every
# start and stop (or, in a dry run, what would have happened) goes to the logbook under "WA car charging". The
# charger is asked for meter readings every minute while it charges (some, like the Sync EV, never send them).
#
# DRY RUN FIRST: "WA car: control the charger" starts OFF; while off, decisions are only logged.
# Turn the charger's own schedule off (in its app) or it will hold the car back ("SuspendedEVSE").
# Needs World Assistant 0.20 or later; works best with the energy plan package (wa_energy_plan.yaml).

# When charging last stopped (any reason), and when it last stopped because the car was full. Kept across restarts.
input_datetime:
  wa_ev_stopped_at:
    name: "WA car: last stopped"
    has_date: true
    has_time: true
  wa_ev_full_at:
    name: "WA car: last stopped full"
    has_date: true
    has_time: true
  wa_ev_retry_at:
    name: "WA car: start last sent again"
    has_date: true
    has_time: true

input_boolean:
  wa_ev_apply:
    name: "WA car: control the charger"
    icon: mdi:ev-station
  wa_ev_low_enabled:
    name: "WA car: always charge when low"
    icon: mdi:battery-alert-variant-outline
  wa_ev_battery_enabled:
    name: "WA car: also charge from the house battery"
    icon: mdi:home-battery-outline

input_number:
  wa_ev_target_soc:
    name: "WA car: charge to"
    min: 30
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 80
  wa_ev_free_room_pct:
    # no "initial": what you set is kept across restarts; it starts at 0 (no room left)
    name: "WA car: leave room per free hour"
    icon: mdi:gift-outline
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
  wa_ev_rest_min:
    # no "initial": kept across restarts; it starts at 60
    name: "WA car: rest after full"
    icon: mdi:timer-sand
    min: 60
    max: 360
    step: 30
    unit_of_measurement: min
  wa_ev_amps:
    # no "initial": kept across restarts; it starts at 0, which leaves the charger's current as it is
    name: "WA car: charge current"
    icon: mdi:current-ac
    min: 0
    max: 32
    step: 1
    unit_of_measurement: A
  wa_ev_battery_amps:
    # no "initial": kept across restarts; it starts at 6 A, the least a charger can be set to
    name: "WA car: current from the house battery"
    icon: mdi:current-ac
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
  wa_ev_battery_above:
    # no "initial": kept across restarts; it starts at 60%
    name: "WA car: house battery above"
    icon: mdi:home-battery
    min: 60
    max: 100
    step: 5
    unit_of_measurement: "%"
  wa_ev_usable_kwh:
    # no "initial": kept across restarts; it starts at 20, a little under a 24 kWh Leaf's usable charge, so an
    # estimate stops early rather than late
    name: "WA car: usable battery"
    icon: mdi:car-battery
    min: 20
    max: 100
    step: 1
    unit_of_measurement: kWh
  wa_ev_min_soc:
    name: "WA car: low means below"
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "%"
    initial: 20

# The entities this plan uses. No "initial": what you set is kept across restarts; empty means the default.
input_text:
  wa_ev_entity_status:
    name: "WA car: charger status entity (default sensor.charger_status_connector)"
    max: 255
  wa_ev_entity_switch:
    name: "WA car: charger start/stop switch (default switch.charger_charge_control)"
    max: 255
  wa_ev_entity_power:
    name: "WA car: charger power entity (default sensor.charger_power_active_import)"
    max: 255
  wa_ev_entity_session:
    name: "WA car: charger session energy entity (default sensor.charger_energy_session)"
    max: 255
  wa_ev_entity_meter:
    name: "WA car: charger energy meter entity (default sensor.charger_energy_active_import_register)"
    max: 255
  wa_ev_entity_soc:
    name: "WA car: car charge level entity (default sensor.hv66bzd_instrument_soc_nissan_leaf)"
    max: 255
  wa_ev_entity_range:
    name: "WA car: car range entity (default sensor.nissan_leaf_hv66bzd_estimated_range)"
    max: 255
  wa_ev_entity_current:
    name: "WA car: charger maximum current entity (default number.charger_maximum_current)"
    max: 255

template:
  # Home Assistant makes each entity id from the name, not the unique_id: sensor.wa_car_charging_plan,
  # sensor.wa_car_range_miles and sensor.wa_car_full_charge_range are the ids to use.
  - sensor:
      # The configured entities, read through fixed names so triggers, the dashboard and the outcome log never change.
      - name: "WA charger status"
        unique_id: wa_charger_status
        icon: mdi:ev-plug-type2
        state: >-
          {% set e = states('input_text.wa_ev_entity_status') %}
          {{ states(e if e.count('.') == 1 else ('sensor.wa_ocpp_status' if has_value('sensor.wa_ocpp_status') else 'sensor.charger_status_connector')) }}
      - name: "WA charger power"
        unique_id: wa_charger_power
        unit_of_measurement: kW
        device_class: power
        state: >-
          {% set e = states('input_text.wa_ev_entity_power') %}
          {{ states(e if e.count('.') == 1 else ('sensor.wa_ocpp_power' if has_value('sensor.wa_ocpp_power') else 'sensor.charger_power_active_import')) | float(0) }}
      - name: "WA charger session energy"
        unique_id: wa_charger_session_energy
        unit_of_measurement: kWh
        device_class: energy
        state: >-
          {% set e = states('input_text.wa_ev_entity_session') %}
          {{ states(e if e.count('.') == 1 else ('sensor.wa_ocpp_session_energy' if has_value('sensor.wa_ocpp_session_energy') else 'sensor.charger_energy_session')) | float(0) }}
      - name: "WA charger energy total"
        unique_id: wa_charger_energy_total
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set e = states('input_text.wa_ev_entity_meter') %}
          {% set v = states(e if e.count('.') == 1 else ('sensor.wa_ocpp_energy' if has_value('sensor.wa_ocpp_energy') else 'sensor.charger_energy_active_import_register')) %}
          {{ v | float if is_number(v) else none }}
      # what the car itself last said (the plan uses "WA car charge level" below, which fills the gaps)
      - name: "WA car reported charge level"
        unique_id: wa_car_reported_charge_level
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% set e = states('input_text.wa_ev_entity_soc') %}
          {% set v = states(e if e.count('.') == 1 else 'sensor.hv66bzd_instrument_soc_nissan_leaf') %}
          {{ v | float if is_number(v) else none }}
      - name: "WA car range"
        unique_id: wa_car_range
        unit_of_measurement: km
        state: >-
          {% set e = states('input_text.wa_ev_entity_range') %}
          {% set v = states(e if e.count('.') == 1 else 'sensor.nissan_leaf_hv66bzd_estimated_range') %}
          {{ v | float | round(0) if is_number(v) else none }}
      # In miles, and what a full charge would give: today's range per % of the car's own charge figure (the one
      # the plan uses), so it agrees with the charge gauge. Below 5% the figure is too coarse to scale up.
      - name: "WA car range miles"
        unique_id: wa_car_range_mi
        unit_of_measurement: mi
        icon: mdi:map-marker-distance
        state: >-
          {% set km = states('sensor.wa_car_range') %}
          {{ (km | float * 0.621371) | round(1) if is_number(km) else none }}
      - name: "WA car full charge range"
        unique_id: wa_car_full_range_mi
        unit_of_measurement: mi
        icon: mdi:map-marker-distance
        state: >-
          {% set km = states('sensor.wa_car_range') %}
          {% set soc = states('sensor.wa_car_charge_level') %}
          {{ (km | float * 0.621371 * 100 / soc | float) | round(0) if is_number(km) and is_number(soc) and soc | float >= 5 else none }}

      # what the charge now runs on: grid (cheap, free or low) or battery (the house battery); none when not charging
      - name: "WA car charge source"
        unique_id: wa_ev_source
        icon: mdi:transmission-tower-import
        state: >-
          {% set soc = states('sensor.wa_car_charge_level') | float(-1) %}
          {% set target = states('input_number.wa_ev_target_soc') | float(80) %}
          {% set hm = now().strftime('%H:%M') %}
          {% set ns = namespace(window=false) %}
          {% for w in state_attr('sensor.wa_energy_charge_schedule', 'windows') or [] %}
            {% if (w.start < w.end and w.start <= hm < w.end) or (w.end <= w.start and (hm >= w.start or hm < w.end)) %}
              {% set ns.window = true %}{% endif %}
          {% endfor %}
          {% set grid = is_state('sensor.wa_energy_free_electricity_now', 'on') or is_state('sensor.wa_energy_cheap_now', 'on') or ns.window
             or (is_state('input_boolean.wa_ev_low_enabled', 'on') and 0 <= soc < states('input_number.wa_ev_min_soc') | float(20)) %}
          {% if not is_state('sensor.wa_car_charging_plan', 'charge') %}none{% elif grid %}grid{% else %}battery{% endif %}

      - name: "WA car charging plan"
        unique_id: wa_ev_plan
        icon: mdi:car-electric
        # charge | wait | full | unplugged
        state: >-
          {% set status = states('sensor.wa_charger_status') %}
          {% set soc = states('sensor.wa_car_charge_level') | float(-1) %}
          {% set target = states('input_number.wa_ev_target_soc') | float(80) %}
          {% set low = is_state('input_boolean.wa_ev_low_enabled', 'on') and 0 <= soc < states('input_number.wa_ev_min_soc') | float(20) %}
          {% set hm = now().strftime('%H:%M') %}
          {% set ns = namespace(window=false) %}
          {% for w in state_attr('sensor.wa_energy_charge_schedule', 'windows') or [] %}
            {% if (w.start < w.end and w.start <= hm < w.end) or (w.end <= w.start and (hm >= w.start or hm < w.end)) %}
              {% set ns.window = true %}{% endif %}
          {% endfor %}
          {% set cheap = is_state('sensor.wa_energy_cheap_now', 'on') or ns.window %}
          {% set free = is_state('sensor.wa_energy_free_electricity_now', 'on') %}
          {% set ns2 = namespace(n=0) %}
          {% for u in state_attr('sensor.wa_energy_free_electricity_next_start', 'upcoming') or [] %}
            {% set st = as_datetime(u.start, none) %}
            {% if u.joined and st is not none and now() < st <= now() + timedelta(hours=24) %}{% set ns2.n = ns2.n + 1 %}{% endif %}
          {% endfor %}
          {% set room = [states('input_number.wa_ev_free_room_pct') | float(0) * ns2.n, target] | min %}
          {% set full_ts = state_attr('input_datetime.wa_ev_full_at', 'timestamp') %}
          {% set rest = states('input_number.wa_ev_rest_min') | float(60) %}
          {% set held = full_ts is number and now().timestamp() < full_ts + rest * 60 and (soc < 0 or soc >= target - 5) %}
          {% set cur = states('input_text.wa_ev_entity_current') %}{% set cur = cur if cur.count('.') == 1 else 'number.charger_maximum_current' %}
          {% set house = states('sensor.office_inverter_battery_soc') | float(-1) %}
          {% set above = states('input_number.wa_ev_battery_above') | float(60) - (5 if status == 'Charging' else 0) %}
          {% set battery = is_state('input_boolean.wa_ev_battery_enabled', 'on') and is_number(states(cur)) and house >= above > 0 %}
          {% if status in ['Available', 'Unavailable', 'Faulted', 'unknown', 'unavailable'] %}unplugged
          {% elif soc >= 0 and soc >= target %}full
          {% elif held %}full
          {% elif free or low %}charge
          {% elif cheap and (soc < 0 or soc < target - room) %}charge
          {% elif battery and not cheap %}charge
          {% else %}wait{% endif %}
        attributes:
          why: >-
            {% set soc = states('sensor.wa_car_charge_level') | float(-1) %}
            {% set target = states('input_number.wa_ev_target_soc') | float(80) %}
            {% set ns2 = namespace(n=0, first=none) %}
            {% for u in state_attr('sensor.wa_energy_free_electricity_next_start', 'upcoming') or [] %}
              {% set st = as_datetime(u.start, none) %}
              {% if u.joined and st is not none and now() < st <= now() + timedelta(hours=24) %}{% set ns2.n = ns2.n + 1 %}{% if ns2.first is none %}{% set ns2.first = st %}{% endif %}{% endif %}
            {% endfor %}
            {% set room = [states('input_number.wa_ev_free_room_pct') | float(0) * ns2.n, target] | min %}
            {% set note = (' (the car is quiet: its charge is estimated at ' ~ soc | round(0) | int ~ '%)') if state_attr('sensor.wa_car_charge_level', 'estimated') == true
                          else (' (no charge level from the car: it charges until it stops by itself)') if soc < 0 else '' %}
            {% if is_state('sensor.wa_energy_free_electricity_now', 'on') %}a Free Electricity hour you joined
            {% elif is_state('input_boolean.wa_ev_low_enabled', 'on') and 0 <= soc < states('input_number.wa_ev_min_soc') | float(20) %}the car is below {{ states('input_number.wa_ev_min_soc') | int }}%
            {% elif room > 0 and soc >= 0 and target - room <= soc < target %}leaving {{ room | int }}% for the free electricity at {{ (ns2.first | as_local).strftime('%a %H:%M') }}: charged to {{ (target - room) | int }}% until then
            {% elif is_state('sensor.wa_energy_cheap_now', 'on') %}the rate is cheap now ({{ states('sensor.wa_energy_rate') }} p/kWh)
            {% elif is_state('sensor.wa_car_charge_source', 'battery') %}the house battery is at {{ states('sensor.office_inverter_battery_soc') }}%: charging from it at {{ states('input_number.wa_ev_battery_amps') | int }} A
            {% else %}the rate is not cheap now{% endif %}{{ note }}
          # the current to set (A); 0 leaves the charger's own
          amps: >-
            {% if is_state('sensor.wa_car_charge_source', 'battery') %}{{ states('input_number.wa_ev_battery_amps') | int(6) }}
            {% else %}{{ states('input_number.wa_ev_amps') | int(0) }}{% endif %}
          # while resting after a full charge: when it may start again
          rests_until: >-
            {% set full_ts = state_attr('input_datetime.wa_ev_full_at', 'timestamp') %}
            {% set until = full_ts + (states('input_number.wa_ev_rest_min') | float(60)) * 60 if full_ts is number else none %}
            {{ (now() + timedelta(seconds=until - now().timestamp())).isoformat() if until is not none and now().timestamp() < until else none }}
          # the next cheap or joined free time, whichever is sooner
          next_start: >-
            {% set c = as_datetime(states('sensor.wa_energy_next_cheap_start'), none) %}
            {% set f = as_datetime(states('sensor.wa_energy_free_electricity_next_start'), none) %}
            {% set f = f if f is not none and state_attr('sensor.wa_energy_free_electricity_next_start', 'joined') == true else none %}
            {% set t = [c, f] | reject('none') | min if c is not none or f is not none else none %}
            {{ t.isoformat() if t is not none else none }}

  # The charge level the plan works from: the car's own figure when it has one; while the car is quiet, the last
  # figure plus what the charger has added since (estimated each minute from its power, or from the current it was
  # set to at 230 V and 90% into the car, over "WA car: usable battery"). Kept across restarts.
  - triggers:
      - trigger: state
        entity_id: sensor.wa_car_reported_charge_level
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "WA car charge level"
        unique_id: wa_car_charge_level
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% set rep = states('sensor.wa_car_reported_charge_level') %}
          {% set prev = this.state if this is defined and this.state is defined else none %}
          {% if is_number(rep) %}{{ rep | float | round(1) }}
          {% elif is_number(prev) and is_state('sensor.wa_charger_status', 'Charging') %}
            {% set kw = states('sensor.wa_charger_power') | float(0) %}
            {% set cur = states('input_text.wa_ev_entity_current') %}{% set cur = cur if cur.count('.') == 1 else 'number.charger_maximum_current' %}
            {% set kw = kw if kw > 0.5 else (states(cur) | float(32)) * 0.23 * 0.9 %}
            {{ [prev | float + kw / 60 / (states('input_number.wa_ev_usable_kwh') | float(20)) * 100, 100] | min | round(1) }}
          {% elif is_number(prev) %}{{ prev }}
          {% else %}{{ none }}{% endif %}
        attributes:
          estimated: "{{ not is_number(states('sensor.wa_car_reported_charge_level')) and is_number(this.state if this is defined and this.state is defined else none) }}"

script:
  wa_car_charge_start:
    alias: "WA car: start charging now"
    icon: mdi:play
    sequence:
      - action: switch.turn_on
        target:
          entity_id: >-
            {% set e = states('input_text.wa_ev_entity_switch') %}{{ e if e.count('.') == 1 else ('switch.wa_ocpp_charging' if has_value('switch.wa_ocpp_charging') else 'switch.charger_charge_control') }}
  wa_car_charge_stop:
    alias: "WA car: stop charging now"
    icon: mdi:stop
    sequence:
      - action: switch.turn_off
        target:
          entity_id: >-
            {% set e = states('input_text.wa_ev_entity_switch') %}{{ e if e.count('.') == 1 else ('switch.wa_ocpp_charging' if has_value('switch.wa_ocpp_charging') else 'switch.charger_charge_control') }}

automation:
  - id: wa_ev_plan
    alias: "WA car charging: start and stop the charger"
    mode: queued
    max: 2
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state  # the state only: the plan's reasons and times change far more often than what to do
        entity_id:
          - sensor.wa_car_charging_plan
          - sensor.wa_charger_status
          - input_boolean.wa_ev_apply
        to: ~
    variables:
      switch: >-
        {% set e = states('input_text.wa_ev_entity_switch') %}{{ e if e.count('.') == 1 else ('switch.wa_ocpp_charging' if has_value('switch.wa_ocpp_charging') else 'switch.charger_charge_control') }}
      plan: "{{ states('sensor.wa_car_charging_plan') }}"
      current: >-
        {% set e = states('input_text.wa_ev_entity_current') %}{{ e if e.count('.') == 1 else 'number.charger_maximum_current' }}
      amps: "{{ state_attr('sensor.wa_car_charging_plan', 'amps') | int(0) }}"
      status: "{{ states('sensor.wa_charger_status') }}"
      charging: "{{ status == 'Charging' }}"
      switch_on: "{{ is_state(switch, 'on') }}"
      apply: "{{ is_state('input_boolean.wa_ev_apply', 'on') }}"
      start: "{{ plan == 'charge' and not charging and not switch_on }}"
      # a stop is sent at most every 5 minutes while it charges (the charger can take a while to say it has stopped,
      # and a burst of changes, such as Home Assistant starting, must not send and log one each); with the switch
      # still showing on but not charging, at most every 30 minutes
      stopped_recently: >-
        {% set t = state_attr('input_datetime.wa_ev_stopped_at', 'timestamp') %}
        {{ t is number and now().timestamp() < t + (300 if charging else 1800) }}
      stop: "{{ plan in ['wait', 'full'] and (charging or switch_on) and not stopped_recently }}"
      # the switch shows on, but the charger has sat ready for 10 minutes: no start reached it (the switch can stay on
      # after the last charge, and then no new start is sent); send it again, at most every 30 minutes
      stuck: >-
        {% set r = state_attr('input_datetime.wa_ev_retry_at', 'timestamp') %}
        {% set since = states.sensor.wa_charger_status.last_changed if states.sensor.wa_charger_status else none %}
        {{ plan == 'charge' and switch_on and status in ['Preparing', 'SuspendedEVSE']
           and since is not none and (now() - since).total_seconds() > 600
           and not (r is number and now().timestamp() < r + 1800) }}
      soc: "{{ states('sensor.wa_car_charge_level') }}"
      next: >-
        {% set t = as_datetime(state_attr('sensor.wa_car_charging_plan', 'next_start'), none) %}
        {{ (t | as_local).strftime('%a %H:%M') if t is not none else 'not known yet' }}
    conditions:
      - condition: template
        value_template: "{{ start or stop or stuck }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ stuck }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.wa_ev_retry_at
            data:
              timestamp: "{{ now().timestamp() }}"
          - if:
              - condition: template
                value_template: "{{ apply }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ switch }}"
              - delay: "00:00:20"
              - action: switch.turn_on
                target:
                  entity_id: "{{ switch }}"
          - action: logbook.log
            data:
              name: WA car charging
              entity_id: input_boolean.wa_ev_apply
              message: >-
                Sent the start again{{ ' (dry run: nothing changed)' if not apply else '' }}: the charger has been
                {{ status }} for over 10 minutes with its switch on, and the plan wants to charge
                ({{ state_attr('sensor.wa_car_charging_plan', 'why') | trim }}). Car {{ soc }}%.
          - stop: "start sent again"
      - if:  # the current first, so a charge from the house battery never starts at the charger's full rate
          - condition: template
            value_template: "{{ apply and start and amps > 0 and is_number(states(current)) }}"
        then:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: "{{ current }}"
            data:
              value: "{{ amps }}"
      - if:
          - condition: template
            value_template: "{{ apply }}"
        then:
          - action: "switch.turn_{{ 'on' if start else 'off' }}"
            target:
              entity_id: "{{ switch }}"
      - if:
          - condition: template
            value_template: "{{ stop }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.wa_ev_stopped_at
            data:
              timestamp: "{{ now().timestamp() }}"
          - if:
              - condition: template
                value_template: "{{ plan == 'full' and charging }}"
            then:  # stopped because it reached the target: rest before starting again
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.wa_ev_full_at
                data:
                  timestamp: "{{ now().timestamp() }}"
      - action: logbook.log
        data:
          name: WA car charging
          entity_id: input_boolean.wa_ev_apply
          message: >-
            {{ 'Started' if start else 'Stopped' }} charging the car{{ ' (dry run: nothing changed)' if not apply else '' }}:
            {% if start %}{{ state_attr('sensor.wa_car_charging_plan', 'why') | trim }}{% elif plan == 'full' %}it is at {{ soc }}%, the
            target is {{ states('input_number.wa_ev_target_soc') | int }}%{% else %}{{ state_attr('sensor.wa_car_charging_plan', 'why') | trim }};
            next cheap or free time {{ next }}{% endif %}. Car {{ soc }}%, charger {{ status }}{{ (', ' ~ amps ~ ' A') if start and amps > 0 and is_number(states(current)) else '' }}.

  - id: wa_ev_current
    alias: "WA car charging: set the charge current"
    mode: queued
    max: 2
    triggers:
      - trigger: state
        entity_id: sensor.wa_car_charging_plan
        attribute: amps
      - trigger: state
        entity_id: sensor.wa_charger_status
        to: Charging
    variables:
      current: >-
        {% set e = states('input_text.wa_ev_entity_current') %}{{ e if e.count('.') == 1 else 'number.charger_maximum_current' }}
      amps: "{{ state_attr('sensor.wa_car_charging_plan', 'amps') | int(0) }}"
      now_amps: "{{ states(current) | float(-1) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.wa_ev_apply
        state: "on"
      - condition: state
        entity_id: sensor.wa_car_charging_plan
        state: charge
      - condition: template
        value_template: "{{ amps > 0 and now_amps >= 0 and now_amps | int != amps }}"
    actions:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ current }}"
        data:
          value: "{{ amps }}"
      - action: logbook.log
        data:
          name: WA car charging
          entity_id: input_boolean.wa_ev_apply
          message: >-
            Charge current set to {{ amps }} A (was {{ now_amps | int }} A): charging from the
            {{ 'house battery' if is_state('sensor.wa_car_charge_source', 'battery') else 'grid' }}.

  - id: wa_ev_meter_values
    alias: "WA car charging: ask the charger for meter readings while it charges"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: sensor.wa_charger_status
        state: Charging
      # through World Assistant's own OCPP server, it asks the charger itself
      - condition: template
        value_template: "{{ not has_value('sensor.wa_ocpp_status') }}"
    actions:
      - action: ocpp.trigger_custom_message
        continue_on_error: true
        data:
          requested_message: MeterValues
