          {% set z = states.zone.home %}{% set ns = namespace(best=none, d=1000) %}{% for t in states.sensor if t.entity_id.startswith('sensor.wa_pollen_tile_') %}{% for p in t.attributes.points | default([]) %}{% set d = distance(z.attributes.latitude, z.attributes.longitude, p.lat, p.lon) %}{% if d is not none and d < ns.d %}{% set ns.d = d %}{% set ns.best = p %}{% endif %}{% endfor %}{% endfor %}{% set a = (ns.best.allergens if ns.best and ns.d <= 150 else []) | selectattr('name', 'search', '(?i)^grass') | list %}{{ a[0].levels[0] if a and a[0].levels and a[0].levels[0] is not none else 'unknown' }}
      - name: WA pollen home mugwort
        unique_id: wa_pollen_home_mugwort
        state_class: measurement
        state: >-
          {% set z = states.zone.home %}{% set ns = namespace(best=none, d=1000) %}{% for t in states.sensor if t.entity_id.startswith('sensor.wa_pollen_tile_') %}{% for p in t.attributes.points | default([]) %}{% set d = distance(z.attributes.latitude, z.attributes.longitude, p.lat, p.lon) %}{% if d is not none and d < ns.d %}{% set ns.d = d %}{% set ns.best = p %}{% endif %}{% endfor %}{% endfor %}{% set a = (ns.best.allergens if ns.best and ns.d <= 150 else []) | selectattr('name', 'search', '(?i)^mugwo') | list %}{{ a[0].levels[0] if a and a[0].levels and a[0].levels[0] is not none else 'unknown' }}
      - name: WA pollen home olive
        unique_id: wa_pollen_home_olive
        state_class: measurement
        state: >-
          {% set z = states.zone.home %}{% set ns = namespace(best=none, d=1000) %}{% for t in states.sensor if t.entity_id.startswith('sensor.wa_pollen_tile_') %}{% for p in t.attributes.points | default([]) %}{% set d = distance(z.attributes.latitude, z.attributes.longitude, p.lat, p.lon) %}{% if d is not none and d < ns.d %}{% set ns.d = d %}{% set ns.best = p %}{% endif %}{% endfor %}{% endfor %}{% set a = (ns.best.allergens if ns.best and ns.d <= 150 else []) | selectattr('name', 'search', '(?i)^olive') | list %}{{ a[0].levels[0] if a and a[0].levels and a[0].levels[0] is not none else 'unknown' }}
      - name: WA pollen home ragweed
        unique_id: wa_pollen_home_ragweed
        state_class: measurement
        state: >-
          {% set z = states.zone.home %}{% set ns = namespace(best=none, d=1000) %}{% for t in states.sensor if t.entity_id.startswith('sensor.wa_pollen_tile_') %}{% for p in t.attributes.points | default([]) %}{% set d = distance(z.attributes.latitude, z.attributes.longitude, p.lat, p.lon) %}{% if d is not none and d < ns.d %}{% set ns.d = d %}{% set ns.best = p %}{% endif %}{% endfor %}{% endfor %}{% set a = (ns.best.allergens if ns.best and ns.d <= 150 else []) | selectattr('name', 'search', '(?i)^ragwe') | list %}{{ a[0].levels[0] if a and a[0].levels and a[0].levels[0] is not none else 'unknown' }}
