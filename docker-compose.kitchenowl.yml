# Adds KitchenOwl, the family's shopping list, on your tailnet: https://kitchenowl.<tailnet>.ts.net
# Everyone uses the KitchenOwl app (iPhone, Android, web); World Assistant reads the list to price it (docs/shopping.md).
#
#   add docker-compose.kitchenowl.yml to COMPOSE_FILE in .env (scripts/setup.sh asks), then docker compose up -d
#
# KitchenOwl has no port on your LAN: phones reach it through its own Tailscale device (tailscale serve, HTTPS,
# Funnel off), at home and away, so the app has one address everywhere. Share that device with the family in the
# Tailscale admin console. World Assistant reaches it by name on the internal network.
#
# Secrets (scripts/init-secrets.sh makes the first): kitchenowl_jwt_secret, and kitchenowl_tailscale_authkey, a
# Tailscale auth key for the first start only (its identity is then kept in WA_DATA_DIR/kitchenowl-tailscale).
# The list lives in WA_DATA_DIR/kitchenowl (SQLite): include that folder in your appdata backup.

services:
  kitchenowl:
    image: tombursch/kitchenowl:${WA_KITCHENOWL_TAG:-v0.7.10}
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/shopping.png"
    networks: [internal]
    environment:
      TZ: ${TZ:-Europe/London}
      JWT_SECRET_KEY_FILE: /run/secrets/kitchenowl_jwt_secret
      # The address the apps use; KitchenOwl allows requests from it (CORS) and puts it in links.
      FRONT_URL: https://${WA_KITCHENOWL_TAILSCALE_NAME:-kitchenowl}.${WA_TAILNET:?set WA_TAILNET in .env to your tailnet name, e.g. tail1234.ts.net}
    secrets:
      - kitchenowl_jwt_secret
    volumes:
      - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/kitchenowl:/data

  kitchenowl-tailscale:
    image: tailscale/tailscale:${WA_TAILSCALE_TAG:-stable}
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://127.0.0.1:${WA_API_PORT:-8010}/icons/shopping.png"
    networks: [internal]
    environment:
      TZ: ${TZ:-Europe/London}
      TS_HOSTNAME: ${WA_KITCHENOWL_TAILSCALE_NAME:-kitchenowl}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${WA_KITCHENOWL_TAILSCALE_ARGS:-}
    secrets:
      - kitchenowl_tailscale_authkey
    volumes:
      - ${WA_DATA_DIR:-/mnt/user/appdata/world-assistant}/kitchenowl-tailscale:/var/lib/tailscale
      - ./deploy/kitchenowl-tailscale:/config:ro
    # As in docker-compose.tailscale.yml: the key comes from the secret, and an OAuth client secret gets
    # ?ephemeral=false (an ordinary auth key must not).
    entrypoint:
      - sh
      - -c
      - |
        key="$$(tr -d '[:space:]' < /run/secrets/kitchenowl_tailscale_authkey 2>/dev/null || true)"
        case "$$key" in
          tskey-client-*) export TS_AUTHKEY="$$key?ephemeral=false" ;;
          ?*) export TS_AUTHKEY="$$key" ;;
        esac
        exec /usr/local/bin/containerboot
    depends_on:
      - kitchenowl

  api:
    environment:
      WA_KITCHENOWL_URL: ${WA_KITCHENOWL_URL:-http://kitchenowl:8080}
      WA_KITCHENOWL_PUBLIC_URL: https://${WA_KITCHENOWL_TAILSCALE_NAME:-kitchenowl}.${WA_TAILNET:-}

secrets:
  kitchenowl_jwt_secret:
    file: ${WA_SECRETS_DIR:-/mnt/user/appdata/world-assistant/secrets}/kitchenowl_jwt_secret.txt
  kitchenowl_tailscale_authkey:
    file: ${WA_SECRETS_DIR:-/mnt/user/appdata/world-assistant/secrets}/kitchenowl_tailscale_authkey.txt
