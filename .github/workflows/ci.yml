name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the automatic-update workflow starts CI on main after it merges

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS, as in production (18 since 0.24.0): the schema has geography columns and spatial indexes.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: wa
          POSTGRES_PASSWORD: wa
          POSTGRES_DB: wa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wa" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WA_TEST_DATABASE_URL: postgresql+psycopg://wa:wa@localhost:5432/wa_test
      WA_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Drop the tiger geocoder
        # The image installs postgis_tiger_geocoder, whose `tiger` schema holds its own `place`
        # table and sits on the search path, shadowing ours. Migration 0019 drops it for real
        # databases; these tests build partial schemas without running the chain, so it goes here
        # too. We do no geocoding.
        env:
          PGPASSWORD: wa
        run: |
          psql -h localhost -U wa -d wa_test -c "DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE"
          psql -h localhost -U wa -d wa_test -c "ALTER DATABASE wa_test SET search_path TO public"
      - name: Install locked dev dependencies
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: A Samba share for the Home Assistant copy test
        # A real SMB server (as Home Assistant's Samba share add-on is), so copying over SMB is tested end to end.
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q samba >/dev/null
          sudo systemctl stop smbd nmbd winbind 2>/dev/null || true
          sudo mkdir -p /srv/haconfig /var/lib/smbtest/{lock,private,state,cache,pid,ncalrpc}
          sudo useradd -M hauser && sudo chown hauser /srv/haconfig
          printf '[global]\n  smb ports = 4445\n  interfaces = lo\n  bind interfaces only = yes\n  disable netbios = yes\n  server min protocol = SMB2_10\n  lock directory = /var/lib/smbtest/lock\n  private dir = /var/lib/smbtest/private\n  state directory = /var/lib/smbtest/state\n  cache directory = /var/lib/smbtest/cache\n  pid directory = /var/lib/smbtest/pid\n  ncalrpc dir = /var/lib/smbtest/ncalrpc\n  log file = /var/lib/smbtest/log.%%m\n  load printers = no\n  printing = bsd\n  printcap name = /dev/null\n  disable spoolss = yes\n[config]\n  path = /srv/haconfig\n  read only = no\n  valid users = hauser\n' \
            | sudo tee /etc/samba/smb-test.conf >/dev/null
          (echo hapass; echo hapass) | sudo smbpasswd -c /etc/samba/smb-test.conf -s -a hauser
          sudo smbd -s /etc/samba/smb-test.conf -D
          for i in $(seq 1 15); do (echo > /dev/tcp/127.0.0.1/4445) 2>/dev/null && break; sleep 1; done
          (echo > /dev/tcp/127.0.0.1/4445) 2>/dev/null || { echo "smbd is not listening"; sudo tail -n 15 /var/lib/smbtest/log.* 2>&1 | cut -c1-300 | sed "s/^/::error title=smbd::/"; exit 1; }
          echo "WA_TEST_SMB=//127.0.0.1:4445/config hauser hapass /srv/haconfig" >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check .
      - name: Test
        # Failing tests are also published as annotations, readable without downloading the log.
        run: |
          set +e
          python -m pytest -q -rfE 2>&1 | tee pytest.txt
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.txt | cut -c1-400 | sed 's/^/::error title=test::/'
          exit "$status"

  image:
    # Proves the image builds (no push). Releases are built by release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: world-assistant:ci
      - name: Image starts and reports its version
        run: |
          docker run --rm --entrypoint python world-assistant:ci -c "import app.main, app.worker; print('imports ok')"
          docker run --rm --entrypoint id world-assistant:ci -u | grep -qx 10001
          ! docker run --rm --entrypoint python world-assistant:ci -c "import pip" 2>/dev/null
      - name: Scan the image as the release does (fixable high or critical findings fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: world-assistant:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  supermarket:
    # The supermarket service (services/supermarket): its tests, its image, and the same scan a release does.
    # The compose overlays for shopping must also hold together with the main file.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (the runner's Node)
        working-directory: services/supermarket
        run: |
          node --version
          npm ci --ignore-scripts
          npm test
      - name: The shopping overlays are valid compose
        run: |
          WA_TAILNET=example.ts.net docker compose -f docker-compose.yml -f docker-compose.kitchenowl.yml \
            -f docker-compose.supermarket.yml config -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/supermarket
          push: false
          load: true
          tags: world-assistant-supermarket:ci
      - name: Image starts, runs as 10001 and refuses to run without a token
        run: |
          docker run --rm --entrypoint id world-assistant-supermarket:ci -u | grep -qx 10001
          ! docker run --rm --entrypoint sh world-assistant-supermarket:ci -c "command -v npm" >/dev/null
          docker run --rm --entrypoint node world-assistant-supermarket:ci -e "require('open-supermarkets/dist/providers/registry'); require('playwright'); console.log('imports ok')"
          ! docker run --rm world-assistant-supermarket:ci 2>/dev/null
          docker run -d --name sm -e SUPERMARKET_API_TOKEN=t world-assistant-supermarket:ci
          for i in $(seq 1 20); do docker exec sm node -e "fetch('http://127.0.0.1:7876/health',{headers:{authorization:'Bearer t'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break; sleep 1; done
          docker exec sm node -e "fetch('http://127.0.0.1:7876/health',{headers:{authorization:'Bearer t'}}).then(r=>r.json()).then(d=>{console.log(JSON.stringify(d));process.exit(d.ok?0:1)})"
          docker rm -f sm
      - name: Scan the image as the release does (fixable high or critical findings fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: world-assistant-supermarket:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  stack:
    # The whole thing, as it runs on the NAS: real compose stack on PostGIS, migrations, every page and
    # endpoint, a backup round trip, and the pages in a real browser. Pollers are off (no internet APIs).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the browser for the page check
        run: |
          pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: Whole-stack check
        run: bash scripts/ci-stack.sh

  pg-upgrade:
    # An existing install's move from PostgreSQL 16 to 18 (scripts/pg-upgrade.sh): a failure goes back by itself,
    # the upgrade keeps every row, and --rollback returns to the old folder.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PostgreSQL 16 to 18
        run: bash scripts/ci-pg-upgrade.sh

  openbao-upgrade:
    # The bundled vault's move from file storage (OpenBao 2.6) to raft (2.7): `scripts/openbao.sh upgrade`.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OpenBao file storage to raft, 2.6 to 2.7
        run: bash scripts/ci-openbao-upgrade.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
