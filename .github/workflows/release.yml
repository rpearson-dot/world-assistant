name: Release

# Build, scan, sign and publish an immutable image. Start it either way:
#   - Actions tab > Release > Run workflow, entering a version such as 0.2.0 (this creates the
#     tag vX.Y.Z on the commit you run it from), or
#   - push a tag like v0.2.0.
# The gate job refuses to release unless this commit is the tip of main, the version is new and CI has
# passed on it (it waits up to 5 minutes for CI to finish). There is no override.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI must have passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            export VERSION="${REF_NAME#v}" EVENT=tag
          else
            export VERSION="$INPUT_VERSION" EVENT=dispatch
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $VERSION"; exit 1; }
          bash scripts/release-gate.sh

  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # attach SBOMs to the GitHub release
      packages: write       # push to GHCR
      id-token: write       # keyless signing and provenance (OIDC)
      attestations: write   # store provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and image name (GHCR needs lower case)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "bad version: $version"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "run from main"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the base image to an exact digest
        run: |
          digest=$(docker buildx imagetools inspect python:3.12-slim --format '{{.Manifest.Digest}}')
          echo "BASE_IMAGE=python@${digest}" >> "$GITHUB_ENV"
          echo "Base image: python@${digest}"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          # BuildKit attaches an SBOM and max-detail provenance to the image itself
          sbom: true
          provenance: mode=max

      - name: Scan the image (fail on fixable high or critical findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the SBOM folder
        run: mkdir -p sbom

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom/world-assistant.spdx.json
          upload-artifact: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom/world-assistant.cdx.json
          upload-artifact: false

      - name: Sign the image (keyless) and attach the SBOMs as attestations
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom/world-assistant.spdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom/world-assistant.cdx.json "$REF"

      # GitHub stores these only for public repositories (or paid plans); the cosign signature and
      # SBOM attestations above work regardless. Set repository variable ENABLE_GH_ATTESTATIONS=true.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: vars.ENABLE_GH_ATTESTATIONS == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

      - name: Publish the release with SBOMs and the image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > release-notes.md <<NOTES
          Image: \`${IMAGE}@${DIGEST}\`
          Base image: \`${BASE_IMAGE}\`

          Deploy by digest (see docs/runbook.md). Verify the signature with:

          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          # --target makes GitHub create the tag vX.Y.Z on this commit when it does not exist yet
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file release-notes.md sbom/world-assistant.spdx.json sbom/world-assistant.cdx.json
