name: Automatic updates

# Opt-in: does nothing unless the repository variable AUTO_UPDATES is "true"
# (Settings > Secrets and variables > Actions > Variables). See docs/runbook.md.
#
# Merges safe Dependabot updates once CI has passed and notices when the Python base image changes
# (it opens an issue). Only if AUTO_RELEASE is also "true" does it release the next patch version
# through the normal gated release. The schedule is the
# backstop; the workflow_run trigger just makes it quicker when Dependabot's CI finishes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write        # merge pull requests
  pull-requests: write
  actions: write         # start CI and the release
  issues: write          # the base-image notice
  checks: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      vars.AUTO_UPDATES == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge safe updates, check the base image, release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTO_UPDATES: ${{ vars.AUTO_UPDATES }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        run: bash scripts/auto-update.sh
