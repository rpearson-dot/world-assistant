# World Assistant energy plan for Home Assistant: sets how full the battery is charged in each cheap Cosy window.
#
# Your inverter's six daily slots already match Cosy (00:00 04:00 07:00 13:00 16:00 22:00, grid charge on for
# slots 2, 4 and 6). This file only changes the TARGET CHARGE LEVEL (Time Slot N Limit) of those three slots:
#
#   slot 6, 22:00-24:00  fills the battery for 00:00-04:00           set at 21:00
#   slot 2, 04:00-07:00  fills it for 07:00-13:00 (less tomorrow's solar)   set at 21:00
#   slot 4, 13:00-16:00  fills it for the 16:00-22:00 peak           set at 12:30
#
# SAVING SESSIONS: if you have joined a session that starts between 16:00 and 22:00, the 13:00 target is raised (a
# bigger margin and a higher floor) so the battery carries the house through it without importing. During a joined
# session a notification is sent if the battery gets low. Nothing here switches the grid off or limits what the
# inverter can draw: if the battery runs down or the house needs more than it can give, the inverter takes the rest
# from the grid by itself. The cost is a lost reward, never a loss of supply. Sessions outside 16:00-22:00 are only
# flagged. Needs World Assistant's Energy sensors (sensor.wa_energy_saving_session_*).
#
# FREE ELECTRICITY: one minute before a Free Electricity hour you have joined (Weekend Happy Hour, Power Up), the
# slot it falls in is set to charge from the grid up to "WA target during free electricity" (100%), so the house
# runs from the grid and the battery fills, for free. The slot's own target and grid-charge switch are saved
# (input_text.wa_free_restore) and put back when the hour ends; back-to-back hours are handled. The 04:00 target only
# covers the morning up to a joined free hour, so nothing is bought that would be free later. Hours you have not
# joined are ignored. Needs World Assistant 0.19.1 or later (sensor.wa_energy_free_electricity_*).
#
# SLOT CHECK: "WA inverter slot check" compares the inverter's slot start times and grid-charge switches with the
# above. If any differ, the plan logs what changed and does not apply, even when switched on.
#
# DRY RUN FIRST: "WA energy plan: apply to inverter" starts OFF. While off, the plan is only worked out and written
# to the logbook. Compare it with what you would choose, then switch it on.
#
# Install: put this file at /config/packages/wa_energy_plan.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then Developer tools > YAML > Check configuration, and restart Home Assistant.
# Needs the Forecast.Solar integration (sensor.energy_production_tomorrow). Without it solar counts as zero, which
# only means buying a little more than necessary.
#
# Tune the defaults below to your house (edit the file; "initial" is applied at every restart).

input_boolean:
  wa_energy_plan_apply:
    name: "WA energy plan: apply to inverter"
    icon: mdi:battery-sync

input_text:
  wa_free_restore:
    name: "WA free electricity: settings to put back"
    max: 255

input_number:
  wa_free_target_pct:
    # Free hours fill to this, but never above the battery health max (raise both to go higher)
    name: "WA target during free electricity"
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 100
  wa_battery_kwh:
    name: "WA battery usable capacity"
    min: 5
    max: 60
    step: 0.5
    unit_of_measurement: kWh
    initial: 30
  wa_floor_pct:
    name: "WA battery reserve floor"
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    initial: 15
  wa_min_target_pct:
    name: "WA lowest charge target"
    min: 10
    max: 90
    step: 5
    unit_of_measurement: "%"
    initial: 25
  wa_max_target_pct:
    # Long-term battery health: the plan never charges above this. When the house would need more before the next
    # cheap window, the plan still stops here and suggests raising it (a notification, the dashboard, the logbook).
    name: "WA battery health max charge"
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 80
  wa_margin:
    name: "WA safety margin on expected use"
    min: 1
    max: 2
    step: 0.05
    initial: 1.25
  wa_night_load_kw:
    name: "WA average load 00:00-04:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 0.6
  wa_morning_load_kw:
    name: "WA average load 07:00-13:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 1.2
  wa_evening_load_kw:
    name: "WA average load 16:00-22:00"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    initial: 2.0
  wa_session_margin:
    name: "WA safety margin when a joined session is due"
    min: 1
    max: 3
    step: 0.05
    initial: 1.5
  wa_session_extra_floor_pct:
    name: "WA extra reserve when a joined session is due"
    min: 0
    max: 40
    step: 5
    unit_of_measurement: "%"
    initial: 10
  wa_session_low_soc_pct:
    name: "WA warn if battery falls below this in a session"
    min: 5
    max: 60
    step: 1
    unit_of_measurement: "%"
    initial: 20
  wa_solar_morning_share:
    name: "WA share of a day's solar before 13:00"
    min: 0
    max: 1
    step: 0.05
    initial: 0.5

template:
  - sensor:
      # Are the inverter's slots still the ones this plan is written for? If a start time or a grid-charge switch
      # has been changed on the inverter, the plan only logs (never applies) until they are put back.
      - name: "WA inverter slot check"
        unique_id: wa_inverter_slot_check
        icon: mdi:timetable
        state: >-
          {% set want = {'1': '00:00', '2': '04:00', '3': '07:00', '4': '13:00', '5': '16:00', '6': '22:00'} %}
          {% set ns = namespace(bad=0, unknown=0) %}
          {% for n, t in want.items() %}
            {% set v = states('text.office_inverter_time_slot_' ~ n ~ '_start') %}
            {% if v in ['unknown', 'unavailable'] %}{% set ns.unknown = ns.unknown + 1 %}
            {% elif v[:5] != t %}{% set ns.bad = ns.bad + 1 %}{% endif %}
          {% endfor %}
          {% for n in ['2', '4', '6'] %}
            {% set v = states('switch.office_inverter_time_slot_' ~ n ~ '_on') %}
            {% if v in ['unknown', 'unavailable'] %}{% set ns.unknown = ns.unknown + 1 %}
            {% elif v != 'on' %}{% set ns.bad = ns.bad + 1 %}{% endif %}
          {% endfor %}
          {{ 'mismatch' if ns.bad else ('unchecked' if ns.unknown else 'ok') }}
        attributes:
          problems: >-
            {% set want = {'1': '00:00', '2': '04:00', '3': '07:00', '4': '13:00', '5': '16:00', '6': '22:00'} %}
            {% set ns = namespace(out=[]) %}
            {% for n, t in want.items() %}
              {% set v = states('text.office_inverter_time_slot_' ~ n ~ '_start') %}
              {% if v not in ['unknown', 'unavailable'] and v[:5] != t %}
                {% set ns.out = ns.out + ['slot ' ~ n ~ ' starts ' ~ v[:5] ~ ', expected ' ~ t] %}{% endif %}
            {% endfor %}
            {% for n in ['2', '4', '6'] %}
              {% if states('switch.office_inverter_time_slot_' ~ n ~ '_on') == 'off' %}
                {% set ns.out = ns.out + ['slot ' ~ n ~ ' grid charge is off'] %}{% endif %}
            {% endfor %}
            {{ ns.out | join('; ') }}
      - name: "WA wanted charge night"
        unique_id: wa_wanted_charge_night
        unit_of_measurement: "%"
        icon: mdi:battery-charging-40
        state: >-
          {% set cap = states('input_number.wa_battery_kwh') | float(30) %}
          {% set need = states('input_number.wa_night_load_kw') | float(0.6) * 4
                        * states('input_number.wa_margin') | float(1.25) %}
          {% set v = states('input_number.wa_floor_pct') | float(15) + need / cap * 100 %}
          {{ [[(v / 5) | round(0) * 5, states('input_number.wa_min_target_pct') | float(25)] | max,
              100] | min | int }}
      - name: "WA wanted charge morning"
        unique_id: wa_wanted_charge_morning
        unit_of_measurement: "%"
        icon: mdi:battery-charging-60
        state: >-
          {% set cap = states('input_number.wa_battery_kwh') | float(30) %}
          {% set solar = states('sensor.energy_production_tomorrow') | float(0)
                         * states('input_number.wa_solar_morning_share') | float(0.5) %}
          {# a joined free hour tomorrow morning: only the hours until it need covering #}
          {% set fs = as_datetime(states('sensor.wa_energy_free_electricity_next_start'), none) %}
          {% set free_h = (fs | as_local).hour if fs is not none
                          and state_attr('sensor.wa_energy_free_electricity_next_start', 'joined') == true
                          and (fs | as_local).date() == (now() + timedelta(days=1)).date()
                          and 7 <= (fs | as_local).hour < 13 else 13 %}
          {% set hours = free_h - 7 %}
          {% set solar = solar * hours / 6 %}
          {% set need = [states('input_number.wa_morning_load_kw') | float(1.2) * hours
                         * states('input_number.wa_margin') | float(1.25) - solar, 0] | max %}
          {% set v = states('input_number.wa_floor_pct') | float(15) + need / cap * 100 %}
          {{ [[(v / 5) | round(0) * 5, states('input_number.wa_min_target_pct') | float(25)] | max,
              100] | min | int }}
      - name: "WA wanted charge evening"
        unique_id: wa_wanted_charge_evening
        unit_of_measurement: "%"
        icon: mdi:battery-charging-80
        state: >-
          {% set cap = states('input_number.wa_battery_kwh') | float(30) %}
          {% set start = as_datetime(states('sensor.wa_energy_saving_session_next_joined_start'), none) %}
          {% set ahead = ((start | as_local) - now()).total_seconds() / 3600 if start else -1 %}
          {% set session = start is not none and 0 <= ahead <= 12 and 16 <= (start | as_local).hour < 22 %}
          {% set margin = states('input_number.wa_session_margin') | float(1.5) if session
                          else states('input_number.wa_margin') | float(1.25) %}
          {% set extra = states('input_number.wa_session_extra_floor_pct') | float(10) if session else 0 %}
          {% set need = states('input_number.wa_evening_load_kw') | float(2) * 6 * margin %}
          {% set v = states('input_number.wa_floor_pct') | float(15) + extra + need / cap * 100 %}
          {{ [[(v / 5) | round(0) * 5, states('input_number.wa_min_target_pct') | float(25)] | max,
              100] | min | int }}
      - name: "WA target charge night"
        unique_id: wa_target_charge_night
        unit_of_measurement: "%"
        icon: mdi:battery-charging-40
        state: >-
          {{ [states('sensor.wa_wanted_charge_night') | int(0), states('input_number.wa_max_target_pct') | int(80)] | min }}
        attributes:
          slot: 6
          covers: "00:00-04:00"
          wanted: "{{ states('sensor.wa_wanted_charge_night') | int(0) }}"
          over_health_max: >-
            {{ states('sensor.wa_wanted_charge_night') | int(0) > states('input_number.wa_max_target_pct') | int(80) }}
      - name: "WA target charge morning"
        unique_id: wa_target_charge_morning
        unit_of_measurement: "%"
        icon: mdi:battery-charging-60
        state: >-
          {{ [states('sensor.wa_wanted_charge_morning') | int(0), states('input_number.wa_max_target_pct') | int(80)] | min }}
        attributes:
          slot: 2
          covers: "07:00-13:00"
          wanted: "{{ states('sensor.wa_wanted_charge_morning') | int(0) }}"
          over_health_max: >-
            {{ states('sensor.wa_wanted_charge_morning') | int(0) > states('input_number.wa_max_target_pct') | int(80) }}
      - name: "WA target charge evening"
        unique_id: wa_target_charge_evening
        unit_of_measurement: "%"
        icon: mdi:battery-charging-80
        state: >-
          {{ [states('sensor.wa_wanted_charge_evening') | int(0), states('input_number.wa_max_target_pct') | int(80)] | min }}
        attributes:
          slot: 4
          covers: "16:00-22:00"
          wanted: "{{ states('sensor.wa_wanted_charge_evening') | int(0) }}"
          over_health_max: >-
            {{ states('sensor.wa_wanted_charge_evening') | int(0) > states('input_number.wa_max_target_pct') | int(80) }}

automation:
  - id: wa_energy_plan_2100
    alias: "WA energy plan 21:00 (tonight 22:00 and tomorrow 04:00)"
    mode: single
    triggers:
      - trigger: time
        at: "21:00:00"
    variables:
      night: "{{ states('sensor.wa_target_charge_night') | int(0) }}"
      morning: "{{ states('sensor.wa_target_charge_morning') | int(0) }}"
      night_now: "{{ states('number.office_inverter_time_slot_6_capacity') | int(0) }}"
      morning_now: "{{ states('number.office_inverter_time_slot_2_capacity') | int(0) }}"
      slots: "{{ states('sensor.wa_inverter_slot_check') }}"
      apply: >-
        {{ is_state('input_boolean.wa_energy_plan_apply', 'on') and is_state('switch.office_inverter_allow_remote_control', 'on')
           and not is_state('sensor.wa_inverter_slot_check', 'mismatch') }}
    conditions:
      - condition: template
        value_template: "{{ night > 0 and morning > 0 }}"
    actions:
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Slot 6 (22:00) target {{ night }}% (now {{ night_now }}%); slot 2 (04:00) target {{ morning }}%
            (now {{ morning_now }}%); tomorrow's solar {{ states('sensor.energy_production_tomorrow') }} kWh.
            {% if slots == 'mismatch' %}Not applied: the inverter's slots have changed ({{ state_attr('sensor.wa_inverter_slot_check', 'problems') }}).
            {% elif apply %}Applying.
            {% elif is_state('input_boolean.wa_energy_plan_apply', 'on') %}Not applied: the inverter's remote control is
            {{ 'missing' if states('switch.office_inverter_allow_remote_control') in ['unknown', 'unavailable'] else 'off' }}
            (switch.office_inverter_allow_remote_control); turn it on to let the plan change the slots.
            {% else %}Dry run: nothing changed.{% endif %}
            {% if slots == 'unchecked' %}(Slot times could not be read, so they were not checked.){% endif %}
      - if:
          - condition: template
            value_template: "{{ apply and (night - night_now) | abs >= 5 }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.office_inverter_time_slot_6_capacity
            data:
              value: "{{ night }}"
          - delay: "00:00:20"
      - if:
          - condition: template
            value_template: "{{ apply and (morning - morning_now) | abs >= 5 }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.office_inverter_time_slot_2_capacity
            data:
              value: "{{ morning }}"

  - id: wa_energy_plan_1230
    alias: "WA energy plan 12:30 (today 13:00)"
    mode: single
    triggers:
      - trigger: time
        at: "12:30:00"
    variables:
      evening: "{{ states('sensor.wa_target_charge_evening') | int(0) }}"
      evening_now: "{{ states('number.office_inverter_time_slot_4_capacity') | int(0) }}"
      slots: "{{ states('sensor.wa_inverter_slot_check') }}"
      apply: >-
        {{ is_state('input_boolean.wa_energy_plan_apply', 'on') and is_state('switch.office_inverter_allow_remote_control', 'on')
           and not is_state('sensor.wa_inverter_slot_check', 'mismatch') }}
    conditions:
      - condition: template
        value_template: "{{ evening > 0 }}"
    actions:
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Slot 4 (13:00) target {{ evening }}% (now {{ evening_now }}%).
            {% if slots == 'mismatch' %}Not applied: the inverter's slots have changed ({{ state_attr('sensor.wa_inverter_slot_check', 'problems') }}).
            {% elif apply %}Applying.
            {% elif is_state('input_boolean.wa_energy_plan_apply', 'on') %}Not applied: the inverter's remote control is
            {{ 'missing' if states('switch.office_inverter_allow_remote_control') in ['unknown', 'unavailable'] else 'off' }}
            (switch.office_inverter_allow_remote_control); turn it on to let the plan change the slots.
            {% else %}Dry run: nothing changed.{% endif %}
            {% if slots == 'unchecked' %}(Slot times could not be read, so they were not checked.){% endif %}
      - if:
          - condition: template
            value_template: "{{ apply and (evening - evening_now) | abs >= 5 }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.office_inverter_time_slot_4_capacity
            data:
              value: "{{ evening }}"

  - id: wa_energy_session_low_battery
    alias: "WA energy plan: warn if the battery runs low in a joined Saving Session"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.office_inverter_battery_soc
        below: input_number.wa_session_low_soc_pct
    conditions:
      - condition: state
        entity_id: sensor.wa_energy_saving_session_now
        state: "on"
      - condition: template
        value_template: "{{ state_attr('sensor.wa_energy_saving_session_now', 'joined') == true }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Saving Session: battery is low"
          message: >-
            Battery is at {{ states('sensor.office_inverter_battery_soc') }}% during a joined Saving Session that ends
            at {{ state_attr('sensor.wa_energy_saving_session_now', 'end') }}. The inverter will take any shortfall
            from the grid, so the house stays supplied, but the reward shrinks.

  - id: wa_energy_session_outside_evening
    alias: "WA energy plan: flag a joined Saving Session the plan does not handle"
    mode: single
    triggers:
      - trigger: time
        at: "12:35:00"
      - trigger: time
        at: "21:05:00"
    variables:
      start: "{{ as_datetime(states('sensor.wa_energy_saving_session_next_joined_start'), none) }}"
    conditions:
      - condition: template
        value_template: >-
          {% set st = as_datetime(states('sensor.wa_energy_saving_session_next_joined_start'), none) %}
          {{ st is not none and 0 <= ((st | as_local) - now()).total_seconds() / 3600 <= 24
             and not (16 <= (st | as_local).hour < 22) }}
    actions:
      - action: persistent_notification.create
        data:
          title: "Saving Session outside 16:00-22:00"
          message: >-
            You have joined a session starting {{ states('sensor.wa_energy_saving_session_next_joined_start') }}.
            The energy plan only prepares for sessions between 16:00 and 22:00, so the battery may not carry the
            house through this one, and a charging slot may be importing during it.

  - id: wa_energy_free_start
    alias: "WA energy plan: a joined Free Electricity hour starts (charge from the grid)"
    mode: queued
    triggers:
      - trigger: time
        at:
          entity_id: sensor.wa_energy_free_electricity_next_start
          offset: "-00:01:00"
    variables:
      start: "{{ states('sensor.wa_energy_free_electricity_next_start') }}"
      end: "{{ state_attr('sensor.wa_energy_free_electricity_next_start', 'end') }}"
      joined: "{{ state_attr('sensor.wa_energy_free_electricity_next_start', 'joined') == true }}"
      slot: >-
        {% set h = (as_datetime(start) | as_local).hour %}
        {{ 1 if h < 4 else 2 if h < 7 else 3 if h < 13 else 4 if h < 16 else 5 if h < 22 else 6 }}
      target: >-
        {{ [states('input_number.wa_free_target_pct') | int(100), states('input_number.wa_max_target_pct') | int(80)] | min }}
      cap_now: "{{ states('number.office_inverter_time_slot_' ~ slot ~ '_capacity') | int(0) }}"
      on_now: "{{ states('switch.office_inverter_time_slot_' ~ slot ~ '_on') }}"
      saved: >-
        {% set r = states('input_text.wa_free_restore') %}
        {{ r | from_json if r.startswith('{') else {} }}
      apply: >-
        {{ is_state('input_boolean.wa_energy_plan_apply', 'on') and is_state('switch.office_inverter_allow_remote_control', 'on')
           and not is_state('sensor.wa_inverter_slot_check', 'mismatch') }}
    conditions:
      - condition: template
        value_template: "{{ joined and end not in [none, ''] and on_now in ['on', 'off'] }}"
    actions:
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Free Electricity {{ (as_datetime(start) | as_local).strftime('%H:%M') }}-{{ (as_datetime(end) | as_local).strftime('%H:%M') }}
            ({{ state_attr('sensor.wa_energy_free_electricity_next_start', 'type') or 'joined' }}): slot {{ slot }} to
            {{ target }}% with grid charge on (now {{ cap_now }}%, grid charge {{ on_now }}).
            {% if apply %}Applying; put back at {{ (as_datetime(end) | as_local).strftime('%H:%M') }}.
            {% elif is_state('sensor.wa_inverter_slot_check', 'mismatch') %}Not applied: the inverter's slots have changed.
            {% elif is_state('input_boolean.wa_energy_plan_apply', 'on') %}Not applied: the inverter's remote control is off.
            {% else %}Dry run: nothing changed.{% endif %}
      - if:
          - condition: template
            value_template: "{{ apply }}"
        then:
          # an hour straight after another in a different slot: put that slot back first
          - if:
              - condition: template
                value_template: "{{ saved.slot is defined and saved.slot | string != slot | string }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "number.office_inverter_time_slot_{{ saved.slot }}_capacity"
                data:
                  value: "{{ saved.cap }}"
              - delay: "00:00:10"
              - action: "switch.turn_{{ saved.on }}"
                target:
                  entity_id: "switch.office_inverter_time_slot_{{ saved.slot }}_on"
              - delay: "00:00:10"
          # keep what was there before the first of back-to-back hours in the same slot
          - action: input_text.set_value
            target:
              entity_id: input_text.wa_free_restore
            data:
              value: >-
                {% set same = saved.slot is defined and saved.slot | string == slot | string %}
                {{ {'slot': slot | int, 'cap': saved.cap if same else cap_now, 'on': saved.on if same else on_now,
                    'end': end} | to_json }}
          - action: number.set_value
            target:
              entity_id: "number.office_inverter_time_slot_{{ slot }}_capacity"
            data:
              value: "{{ target }}"
          - delay: "00:00:10"
          - action: switch.turn_on
            target:
              entity_id: "switch.office_inverter_time_slot_{{ slot }}_on"

  - id: wa_energy_free_end
    alias: "WA energy plan: the Free Electricity hour is over (put the slot back)"
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set r = states('input_text.wa_free_restore') %}
          {{ r.startswith('{') and now() >= as_datetime((r | from_json).end) }}
      - trigger: homeassistant
        event: start
    variables:
      saved: >-
        {% set r = states('input_text.wa_free_restore') %}
        {{ r | from_json if r.startswith('{') else {} }}
    conditions:
      - condition: template
        value_template: "{{ saved.slot is defined and now() >= as_datetime(saved.end) }}"
    actions:
      - action: number.set_value
        target:
          entity_id: "number.office_inverter_time_slot_{{ saved.slot }}_capacity"
        data:
          value: "{{ saved.cap }}"
      - delay: "00:00:10"
      - action: "switch.turn_{{ saved.on }}"
        target:
          entity_id: "switch.office_inverter_time_slot_{{ saved.slot }}_on"
      - action: input_text.set_value
        target:
          entity_id: input_text.wa_free_restore
        data:
          value: ""
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: >-
            Free Electricity over: slot {{ saved.slot }} put back to {{ saved.cap }}% with grid charge {{ saved.on }}.

  - id: wa_energy_health_max_suggestion
    alias: "WA energy plan: suggest raising the battery health max when the house needs more"
    mode: single
    triggers:
      - trigger: time
        at: "21:01:00"
      - trigger: time
        at: "12:31:00"
    variables:
      capped: >-
        {% set ns = namespace(out=[]) %}
        {% for p in ['night', 'morning', 'evening'] %}
          {% set e = 'sensor.wa_target_charge_' ~ p %}
          {% if state_attr(e, 'over_health_max') in [true, 'True', 'true'] %}
            {% set ns.out = ns.out + ['slot ' ~ state_attr(e, 'slot') ~ ' (for ' ~ state_attr(e, 'covers') ~ ') wants '
                                      ~ state_attr(e, 'wanted') ~ '%'] %}
          {% endif %}
        {% endfor %}
        {{ ns.out | join('; ') }}
    conditions:
      - condition: template
        value_template: "{{ capped | length > 0 }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: wa_health_max
          title: "Battery: more needed than the health max"
          message: >-
            {{ capped }}, above your battery health max of {{ states('input_number.wa_max_target_pct') | int }}%.
            The plan charges to {{ states('input_number.wa_max_target_pct') | int }}%, so the rest will be bought at the
            standard or peak rate before the next cheap window. To cover it, raise "WA battery health max charge" on
            the Home charging dashboard (it applies at the next planning run, 21:00 or 12:30).
      - action: logbook.log
        data:
          name: WA energy plan
          entity_id: input_boolean.wa_energy_plan_apply
          message: "Capped at the battery health max: {{ capped }}. Raise it to cover this."
